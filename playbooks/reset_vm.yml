---
# Quick Reset Playbook - Removes our deployments for clean testing

- name: Reset Lab Environment for Fresh Install Testing
  hosts: vps_lab
  become: yes
  tasks:
    
    - name: Stop all services
      service:
        name: "{{ item }}"
        state: stopped
      loop:
        - apache2
        - mariadb
        - gitea
      ignore_errors: yes

    - name: Remove web content
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/www/html
        - /home/gitea
        - /etc/gitea

    - name: Remove databases
      shell: |
        mysql -u root -pCleanLabPassword123! -e "DROP DATABASE IF EXISTS testdb;"
        mysql -u root -pCleanLabPassword123! -e "DROP DATABASE IF EXISTS gitea;"
        mysql -u root -pCleanLabPassword123! -e "DROP DATABASE IF EXISTS mantisbt;"
      ignore_errors: yes

    - name: Remove database users
      shell: |
        mysql -u root -pCleanLabPassword123! -e "DROP USER IF EXISTS 'gitea'@'localhost';"
        mysql -u root -pCleanLabPassword123! -e "DROP USER IF EXISTS 'mantisbt'@'localhost';"
      ignore_errors: yes

    - name: Recreate clean web directory
      file:
        path: /var/www/html
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Restore default Apache page
      shell: |
        apt-get install --reinstall apache2 -y
      ignore_errors: yes

    - name: Remove test users
      user:
        name: "{{ item }}"
        state: absent
        remove: yes
      loop:
        - sysadmin
        - guest
        - backup
      ignore_errors: yes

    - name: Display reset complete
      debug:
        msg: "VM reset complete! Ready for fresh deployment test."