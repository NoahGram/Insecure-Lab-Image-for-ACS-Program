        query: |
          CREATE TABLE IF NOT EXISTS users (
            id INT AUTO_INCREMENT PRIMARY KEY,
            username VARCHAR(50),
            password VARCHAR(50),
            email VARCHAR(100)
          );

    - name: Insert sample users (one INSERT per loop item)
      mysql_query:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_db: wikidb
        query: "INSERT IGNORE INTO users (id, username, password, email) VALUES ({{ item.id }}, '{{ item.username }}', '{{ item.password }}', '{{ item.email }}');"
      loop:
        - { id: 1, username: 'admin', password: 'admin123', email: 'admin@portal.local' }
        - { id: 2, username: 'jane',  password: 'password',  email: 'jane@portal.local' }
        - { id: 3, username: 'guest', password: 'guest',     email: 'guest@portal.local' }

    # ===========================================
    # CREATE VULNERABLE USERS
    # ===========================================
    - name: Create test users
      user:
        name: "{{ item.name }}"
        password: "{{ item.password | password_hash('sha512') }}"
        shell: /bin/bash
      loop:
        - { name: "sysadmin", password: "admin" }
        - { name: "guest", password: "guest" }
        - { name: "backup", password: "backup123" }

    # ===========================================
    # APACHE CONFIGURATION (EXPOSE INFO)
    # ===========================================
    - name: Enable Apache Info Disclosure
      copy:
        content: |
          <Location "/server-info">
              SetHandler server-info
              Require all granted
          </Location>

          <Location "/server-status">
              SetHandler server-status
              Require all granted
          </Location>
        dest: /etc/apache2/conf-available/info.conf

    - name: Enable vulnerable Apache settings
      lineinfile:
        path: /etc/apache2/apache2.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: "^ServerTokens", line: "ServerTokens Full" }
        - { regexp: "^ServerSignature", line: "ServerSignature On" }

    - name: Enable info config and restart Apache
      command: a2enconf info
      notify: restart apache

