---
# Database Role - MariaDB installation and configuration
- name: Check if MariaDB is already installed
  shell: dpkg -l mariadb-server 2>/dev/null | grep -E '^ii' || echo "not_installed"
  register: mariadb_installed
  failed_when: false
  changed_when: false

- name: Set MariaDB installation status
  set_fact:
    mariadb_is_installed: "{{ 'not_installed' not in mariadb_installed.stdout }}"

- name: Display MariaDB version information if already installed
  debug:
    msg: "MariaDB is already installed: {{ mariadb_installed.stdout_lines | select('match', '.*mariadb-server.*') | list | first | default('Version info not found') }}"
  when: mariadb_is_installed

- name: Add MariaDB repository for specific versions (if not latest and not already installed)
  block:
    - name: Install MariaDB repository key
      apt_key:
        url: https://mariadb.org/mariadb_release_signing_key.asc
        state: present
    - name: Add MariaDB repository
      apt_repository:
        repo: "deb [arch=amd64,arm64,ppc64el] https://archive.mariadb.org/mariadb-{{ mysql_version }}/repo/ubuntu {{ ansible_distribution_release }} main"
        state: present
    - name: Update apt cache for MariaDB
      apt:
        update_cache: yes
  when: mysql_version != "latest" and not mariadb_is_installed

- name: Install MariaDB Server and client
  ansible.builtin.apt:
    name:
      - "{% if mysql_version == 'latest' %}mariadb-server{% else %}mariadb-server={{ mysql_version }}*{% endif %}"
      - "{% if mysql_version == 'latest' %}mariadb-client{% else %}mariadb-client={{ mysql_version }}*{% endif %}"
      - python3-pymysql
    state: present
    update_cache: yes
  when: not mariadb_is_installed

- name: Start and enable MariaDB service
  systemd:
    name: mariadb
    state: started
    enabled: yes

- name: Wait for MariaDB to be ready
  wait_for:
    port: 3306
    host: localhost
    timeout: 30

- name: Check if MariaDB root password is already set
  command: mysql -u root -e "SELECT 1"
  register: mysql_root_access
  failed_when: false
  changed_when: false

- name: Set MariaDB root password (first time setup)
  mysql_user:
    name: root
    password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when: mysql_root_access.rc == 0

- name: Try to update MariaDB root password with unix socket (if password login fails)
  mysql_user:
    name: root
    password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  ignore_errors: yes
  when: mysql_root_access.rc != 0

# Configure MariaDB password hashing behaviour depending on vulnerable_mode
- name: Configure MariaDB to use weak hashing (old_passwords) when vulnerable_mode is enabled
  copy:
    dest: /etc/mysql/conf.d/10-auth-method.cnf
    content: |
      [mysqld]
      old_passwords=1
      default_authentication_plugin=mysql_native_password
  notify: Restart mariadb
  become: yes
  when: vulnerable_mode | default(false)

- name: Configure MariaDB to prefer bcrypt when not in vulnerable_mode
  copy:
    dest: /etc/mysql/conf.d/10-auth-method.cnf
    content: |
      [mysqld]
      plugin_load_add=auth_bcrypt=auth_bcrypt.so
      default_authentication_plugin=auth_bcrypt
  notify: Restart mariadb
  become: yes
  when: not (vulnerable_mode | default(false))


- name: Create MariaDB configuration for root user
  copy:
    content: |
      [client]
      user=root
      password={{ mysql_root_password }}
    dest: /root/.my.cnf
    mode: '0600'

- name: Verify MariaDB connection with new credentials
  command: mysql -u root --password={{ mysql_root_password }} -e "SELECT VERSION();"
  register: mysql_version_check
  changed_when: false

- name: Display MariaDB version after installation
  debug:
    msg: "MariaDB is running: {{ mysql_version_check.stdout_lines | last }}"

- name: Remove anonymous MariaDB users
  mysql_user:
    name: ""
    state: absent
    login_user: root
    login_password: "{{ mysql_root_password }}"
  ignore_errors: yes

- name: Remove MariaDB test database
  mysql_db:
    name: test
    state: absent
    login_user: root
    login_password: "{{ mysql_root_password }}"
  ignore_errors: yes

# Create application databases
- name: Create Gitea database
  mysql_db:
    name: gitea
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"

- name: Create Gitea database user
  mysql_user:
    name: gitea
    password: "{{ gitea_db_password | default('cup_of_tea') }}"
    priv: "gitea.*:ALL"
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"

- name: Create MantisBT database
  mysql_db:
    name: mantisbt
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"

- name: Create MantisBT database user
  mysql_user:
    name: mantisbt
    password: "{{ mantisbt_db_password | default('apache2Mantis') }}"
    priv: "mantisbt.*:ALL"
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"

# ------------------------------------------
# Vulnerable vs Clean network + default credentials
# - When `vulnerable_mode` is true we:
#   * bind MariaDB to 0.0.0.0 (unsecured port)
#   * create an over-permissive user `default_admin`@`%` with password `default`
#   * open port 3306 via UFW if available
# - When not vulnerable_mode we bind to localhost and remove the insecure user and close the port
# ------------------------------------------

- name: Configure MariaDB bind address for vulnerable deployments
  copy:
    dest: /etc/mysql/conf.d/10-bind-address.cnf
    content: |
      [mysqld]
      bind-address = 0.0.0.0
  notify: Restart mariadb
  become: yes
  when: vulnerable_mode | default(false)

- name: Configure MariaDB bind address for clean deployments
  copy:
    dest: /etc/mysql/conf.d/10-bind-address.cnf
    content: |
      [mysqld]
      bind-address = 127.0.0.1
  notify: Restart mariadb
  become: yes
  when: not (vulnerable_mode | default(false))

- name: Create over-permissive default admin user (vulnerable)
  mysql_user:
    name: default_admin
    password: "default"
    host: "%"
    priv: "*.*:ALL,GRANT"
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
  when: vulnerable_mode | default(false)

- name: Remove over-permissive default admin user (clean)
  mysql_user:
    name: default_admin
    host: "%"
    state: absent
    login_user: root
    login_password: "{{ mysql_root_password }}"
  when: not (vulnerable_mode | default(false))

- name: Ensure UFW is installed (for firewall toggling)
  apt:
    name: ufw
    state: present
    update_cache: yes
  become: yes
  when: ansible_facts['pkg_mgr'] is defined

- name: Open MariaDB port 3306 in UFW (vulnerable)
  ufw:
    rule: allow
    port: 3306
    proto: tcp
  become: yes
  when: vulnerable_mode | default(false)

- name: Close MariaDB port 3306 in UFW (clean)
  ufw:
    rule: deny
    port: 3306
    proto: tcp
  become: yes
  when: not (vulnerable_mode | default(false))