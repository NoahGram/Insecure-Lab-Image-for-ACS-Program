# ===========================================
# CRON JOB INJECTION VULNERABILITY
# ===========================================
- name: Create scripts directory
  file:
    path: /opt/scripts
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: vulnerability_config.system_vulnerabilities.cron_job_injection | default(false)
  tags:
    - system_vulnerabilities
    - cron_job_injection

- name: Deploy maintenance script with weak permissions
  copy:
    src: "{{ playbook_dir }}/files/configs/system-maintenance.sh"
    dest: /opt/scripts/system-maintenance.sh
    owner: root
    group: root
    mode: '0777'  # World-writable - the vulnerability!
  when: vulnerability_config.system_vulnerabilities.cron_job_injection | default(false)
  tags:
    - system_vulnerabilities
    - cron_job_injection

- name: Deploy cron job that runs as root
  copy:
    src: "{{ playbook_dir }}/files/configs/cron-maintenance"
    dest: /etc/cron.d/system-maintenance
    owner: root
    group: root
    mode: '0644'
  when: vulnerability_config.system_vulnerabilities.cron_job_injection | default(false)
  tags:
    - system_vulnerabilities
    - cron_job_injection

- name: Normalize cron file line endings and reload cron
  become: true
  shell: |
    sed -i 's/\r$//' /etc/cron.d/system-maintenance || true
    sed -i 's/\r$//' /opt/scripts/system-maintenance.sh || true
    chown root:root /etc/cron.d/system-maintenance || true
    chmod 0644 /etc/cron.d/system-maintenance || true
    if command -v systemctl >/dev/null 2>&1; then
      systemctl restart cron || systemctl restart crond || true
    else
      service cron restart || service crond restart || true
    fi
  when: vulnerability_config.system_vulnerabilities.cron_job_injection | default(false)
  tags:
    - system_vulnerabilities
    - cron_job_injection

- name: Create maintenance log file
  file:
    path: /var/log/maintenance.log
    state: touch
    owner: root
    group: root
    mode: '0644'
  when: vulnerability_config.system_vulnerabilities.cron_job_injection | default(false)
  tags:
    - system_vulnerabilities
    - cron_job_injection

- name: CVE-2025-32463 - Deploy vulnerable sudo package (prepare variables and check)
  block:
    - name: Set sudo vulnerability base parameters
      set_fact:
        vulnerabilities_install_sudo: true
        vulnerabilities_sudo_download_url: "https://launchpad.net/ubuntu/+source/sudo/1.9.15p5-3ubuntu5/+build/28035899/+files/sudo_1.9.15p5-3ubuntu5_amd64.deb"
        vulnerabilities_sudo_build_deps:
          - build-essential
          - libpam0g-dev
          - libselinux1-dev
          - libssl-dev
          - pkg-config
  when: (vulnerable_mode | default(false)) and (vulnerabilities_install_sudo | default(true))
  tags:
    - CVE-2025-32463
    - vulnerabilities_sudo

- name: CVE-2025-32463 - Deploy vulnerable sudo package (Pre-compiled .deb)
  block:
    - name: Download the pre-compiled vulnerable sudo .deb package
      get_url:
        # Use the specific URL for the Ubuntu 22.04 package you found
        url: "{{ vulnerabilities_sudo_download_url }}"
        # Download it to the /tmp directory, which is a safe staging area
        dest: /tmp/sudo-vulnerable.deb
        mode: '0644'
        # Set a reasonable timeout
        timeout: 60
      register: sudo_deb_get
      failed_when: false
      changed_when: false

    - name: Check for downloaded deb
      stat:
        path: /tmp/sudo-vulnerable.deb
      register: sudo_deb_stat

    - name: Use bundled local deb if download failed
      copy:
        src: "files/sudo-vulnerable.deb"
        dest: /tmp/sudo-vulnerable.deb
        mode: '0644'
      when: not sudo_deb_stat.stat.exists

    - name: Install the vulnerable sudo package via APT
      ansible.builtin.apt:
        deb: /tmp/sudo-vulnerable.deb
        state: present
        # Force, because otherwise it will reject, because we replace the /etc/sudoers file.
        force: true
      become: yes
      register: sudo_install

    - name: Cleanup package file
      ansible.builtin.file:
        path: /tmp/sudo-vulnerable.deb
        state: absent

  when: (vulnerable_mode | default(false)) and (vulnerabilities_install_sudo | default(true))
  tags:
    - CVE-2025-32463
    - vulnerabilities_sudo


- name: Ensure neofetch binary is present in /usr/bin
  copy:
    src: "files/neofetch"
    dest: /usr/bin/neofetch
    owner: root
    group: root
    mode: '0755'
  become: yes
  when: vulnerability_config.system_vulnerabilities.deploy_neofetch | default(true)
  tags:
    - system_vulnerabilities
    - neofetch

- name: Ensure cron.hourly wrapper for neofetch exists
  copy:
    dest: /etc/cron.hourly/neofetch
    content: |
      #!/bin/sh
      # Run neofetch and append output to a dedicated log for detection exercises
      # Cron runs this as root, so we can append the output safely.
      /usr/bin/neofetch 2>&1 | tee -a /var/log/neofetch.log >/dev/null
    owner: root
    group: root
    mode: '0755'
  become: yes
  when: vulnerability_config.system_vulnerabilities.deploy_neofetch | default(true)
  tags:
    - system_vulnerabilities
    - neofetch
- name: Ensure neofetch log file exists
  file:
    path: /var/log/neofetch.log
    state: touch
    owner: root
    group: root
    mode: '0644'
  become: yes
  when: vulnerability_config.system_vulnerabilities.deploy_neofetch | default(true)
  tags:
    - system_vulnerabilities
    - neofetch

