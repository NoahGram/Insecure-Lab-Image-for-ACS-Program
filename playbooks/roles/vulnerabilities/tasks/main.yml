---
# Vulnerabilities Role - Granular vulnerability controls based on profile configuration
# Each vulnerability type can be individually enabled/disabled using profile settings

# ===========================================
# WEB VULNERABILITIES
# ===========================================

- name: Create SQL injection vulnerable page
  copy:
    content: |
      <?php
      // SQL Injection Vulnerability - TESTING ONLY
      echo "<h1>SQL Injection Test Page</h1>";
      if (isset($_GET['id'])) { 
          $id = $_GET['id']; 
          $query = "SELECT * FROM users WHERE id = " . $id; 
          echo "<p>Query: " . htmlspecialchars($query) . "</p>"; 
      }
      ?>
      <h2>Test SQL Injection</h2>
      <form method="GET">
          <label>User ID: <input type="text" name="id" placeholder="1"></label>
          <input type="submit" value="Search">
      </form>
      <p>Try: <code>1' OR '1'='1</code></p>
    dest: /var/www/html/sql_injection.php
    owner: www-data
    group: www-data
    mode: '0644'
  when: vulnerability_config.web_vulnerabilities.sql_injection | default(false)
  tags:
    - web_vulnerabilities
    - sql_injection

- name: Create XSS vulnerable page
  copy:
    content: |
      <?php
      // XSS Vulnerability - TESTING ONLY
      echo "<h1>XSS Test Page</h1>";
      if (isset($_GET['name'])) { 
          echo "<p>Hello " . $_GET['name'] . "</p>"; // Unescaped output
      }
      ?>
      <h2>Test XSS</h2>
      <form method="GET">
          <label>Name: <input type="text" name="name"></label>
          <input type="submit" value="Submit">
      </form>
      <p>Try: <code>&lt;script&gt;alert('XSS')&lt;/script&gt;</code></p>
    dest: /var/www/html/xss_test.php
    owner: www-data
    group: www-data
    mode: '0644'
  when: vulnerability_config.web_vulnerabilities.xss_vulnerabilities | default(false)
  tags:
    - web_vulnerabilities
    - xss

- name: Create vulnerable upload directory
  file:
    path: /var/www/html/uploads
    state: directory
    owner: www-data
    group: www-data
    mode: '0777'
  when: vulnerability_config.web_vulnerabilities.file_upload_bypass | default(false)
  tags:
    - web_vulnerabilities
    - file_upload

- name: Create file upload bypass vulnerable page
  copy:
    content: |
      <?php
      // File Upload Vulnerability - TESTING ONLY
      echo "<h1>File Upload Test</h1>";
      if ($_SERVER['REQUEST_METHOD'] == 'POST') {
          $target_dir = "uploads/";
          $target_file = $target_dir . basename($_FILES["fileToUpload"]["name"]);
          // NO FILE TYPE VALIDATION - VULNERABILITY
          if (move_uploaded_file($_FILES["fileToUpload"]["tmp_name"], $target_file)) {
              echo "File uploaded: " . htmlspecialchars(basename($_FILES["fileToUpload"]["name"]));
          } else {
              echo "Upload failed";
          }
      }
      ?>
      <h2>Upload Any File</h2>
      <form action="" method="post" enctype="multipart/form-data">
          <input type="file" name="fileToUpload" required>
          <input type="submit" value="Upload" name="submit">
      </form>
      <h3>Uploaded Files:</h3>
      <?php 
      if (is_dir('uploads/')) {
          $files = scandir('uploads/'); 
          foreach($files as $file) { 
              if($file != "." && $file != "..") { 
                  echo "<a href='uploads/$file'>$file</a><br>"; 
              } 
          } 
      }
      ?>
    dest: /var/www/html/file_upload.php
    owner: www-data
    group: www-data
    mode: '0644'
  when: vulnerability_config.web_vulnerabilities.file_upload_bypass | default(false)
  tags:
    - web_vulnerabilities
    - file_upload

- name: Enable Apache server-info and server-status (info disclosure)
  copy:
    content: |
      <Location "/server-info">
          SetHandler server-info
          Require all granted
      </Location>
      <Location "/server-status">
          SetHandler server-status
          Require all granted
      </Location>
    dest: /etc/apache2/conf-available/server-info.conf
  when: vulnerability_config.web_vulnerabilities.info_disclosure | default(false)
  notify: restart apache
  tags:
    - web_vulnerabilities
    - info_disclosure

- name: Enable server-info configuration
  command: a2enconf server-info
  when: vulnerability_config.web_vulnerabilities.info_disclosure | default(false)
  notify: restart apache
  tags:
    - web_vulnerabilities
    - info_disclosure

- name: Create phpinfo disclosure page
  copy:
    content: |
      <?php
      // Information Disclosure - TESTING ONLY
      echo "<h1>System Information</h1>";
      phpinfo();
      ?>
    dest: /var/www/html/info.php
    owner: www-data
    group: www-data
    mode: '0644'
  when: vulnerability_config.web_vulnerabilities.info_disclosure | default(false)
  tags:
    - web_vulnerabilities
    - info_disclosure

- name: Create command injection vulnerable page
  copy:
    content: |
      <?php
      // Command Injection Vulnerability - TESTING ONLY
      echo "<h1>Command Injection Test</h1>";
      if (isset($_POST['host'])) {
          $host = $_POST['host'];
          // VULNERABLE: No input validation
          $output = shell_exec('ping -c 1 ' . $host);
          echo "<pre>" . htmlspecialchars($output) . "</pre>";
      }
      ?>
      <h2>Network Ping Tool</h2>
      <form method="POST">
          <label>Host: <input type="text" name="host" value="127.0.0.1"></label>
          <input type="submit" value="Ping">
      </form>
      <p>Try: <code>127.0.0.1; ls -la</code></p>
    dest: /var/www/html/command_injection.php
    owner: www-data
    group: www-data
    mode: '0644'
  when: vulnerability_config.web_vulnerabilities.command_injection | default(false)
  tags:
    - web_vulnerabilities
    - command_injection

- name: Create path traversal vulnerable page
  copy:
    content: |
      <?php
      // Path Traversal Vulnerability - TESTING ONLY
      echo "<h1>File Viewer</h1>";
      if (isset($_GET['file'])) {
          $file = $_GET['file'];
          // VULNERABLE: No path validation
          if (file_exists($file)) {
              echo "<pre>" . htmlspecialchars(file_get_contents($file)) . "</pre>";
          } else {
              echo "File not found";
          }
      }
      ?>
      <h2>View File</h2>
      <form method="GET">
          <label>File: <input type="text" name="file" value="info.php"></label>
          <input type="submit" value="View">
      </form>
      <p>Try: <code>../../../etc/passwd</code></p>
    dest: /var/www/html/path_traversal.php
    owner: www-data
    group: www-data
    mode: '0644'
  when: vulnerability_config.web_vulnerabilities.path_traversal | default(false)
  tags:
    - web_vulnerabilities
    - path_traversal

# ===========================================
# SYSTEM VULNERABILITIES
# ===========================================

- name: Create weak user accounts
  user:
    name: "{{ item.name }}"
    password: "{{ item.password | password_hash('sha512') }}"
    shell: /bin/bash
    create_home: yes
    comment: "Vulnerable test account"
  loop:
    - { name: "admin", password: "admin" }
    - { name: "test", password: "test" }
    - { name: "guest", password: "guest" }
    - { name: "demo", password: "demo" }
  when: vulnerability_config.system_vulnerabilities.weak_user_accounts | default(false)
  tags:
    - system_vulnerabilities
    - weak_accounts

- name: Add dangerous sudo privileges
  lineinfile:
    path: /etc/sudoers
    line: "{{ item }}"
    validate: 'visudo -cf %s'
  loop:
    - "admin ALL=(ALL) NOPASSWD:ALL"
    - "test ALL=(ALL) ALL"
  when: vulnerability_config.system_vulnerabilities.sudo_misconfiguration | default(false)
  tags:
    - system_vulnerabilities
    - sudo_misconfiguration

- name: Configure Apache with verbose server information
  lineinfile:
    path: /etc/apache2/apache2.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: "^ServerTokens", line: "ServerTokens Full" }
    - { regexp: "^ServerSignature", line: "ServerSignature On" }
  when: vulnerability_config.system_vulnerabilities.service_information_disclosure | default(false)
  notify: restart apache
  tags:
    - system_vulnerabilities
    - service_disclosure

- name: Create world-writable test files
  file:
    path: "{{ item }}"
    state: touch
    mode: '0666'
    owner: www-data
    group: www-data
  loop:
    - /var/www/html/writable_file.txt
    - /tmp/weak_permissions.log
  when: vulnerability_config.system_vulnerabilities.weak_file_permissions | default(false)
  tags:
    - system_vulnerabilities
    - weak_permissions

# ===========================================
# DATABASE VULNERABILITIES
# ===========================================

- name: Create weak database user
  mysql_user:
    name: testuser
    password: "testpass"
    priv: "*.*:ALL"
    host: "%"
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
  when: vulnerability_config.database_vulnerabilities.weak_database_credentials | default(false)
  tags:
    - database_vulnerabilities
    - weak_credentials

- name: Create sample vulnerable database and data
  mysql_db:
    name: testdb
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
  when: vulnerability_config.database_vulnerabilities.sample_vulnerable_data | default(false)
  tags:
    - database_vulnerabilities
    - sample_data

- name: Create vulnerable database table with sample data
  mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_db: testdb
    query: |
      CREATE TABLE IF NOT EXISTS users (
        id INT AUTO_INCREMENT PRIMARY KEY,
        username VARCHAR(50),
        password VARCHAR(50),
        email VARCHAR(100),
        role VARCHAR(20)
      );
      INSERT IGNORE INTO users (id, username, password, email, role) VALUES
      (1, 'admin', 'admin123', 'admin@lab.local', 'admin'),
      (2, 'john', 'password', 'john@lab.local', 'user'),
      (3, 'guest', 'guest', 'guest@lab.local', 'guest'),
      (4, 'test', 'test123', 'test@lab.local', 'user');
  when: vulnerability_config.database_vulnerabilities.sample_vulnerable_data | default(false)
  tags:
    - database_vulnerabilities
    - sample_data

# ===========================================
# APPLICATION VULNERABILITIES
# ===========================================

- name: Deploy comprehensive vulnerable web application
  copy:
    src: "{{ role_path }}/web_stack/actions_vulnerable.php"
    dest: /var/www/html/actions_vulnerable.php
    owner: www-data
    group: www-data
    mode: '0644'
  when: vulnerability_config.application_vulnerabilities.vulnerable_web_apps | default(false)
  tags:
    - application_vulnerabilities
    - vulnerable_apps

