- name: CVE-2025-32463 - Deploy vulnerable sudo package (prepare variables and check)
  block:
    - name: Set sudo vulnerability base parameters
      set_fact:
        vulnerabilities_install_sudo: true
        vulnerabilities_sudo_version: "1.9.15p5"
        vulnerabilities_sudo_build_deps:
          - build-essential
          - libpam0g-dev
          - libselinux1-dev
          - libssl-dev
          - pkg-config

    - name: Set sudo filenames and download paths
      set_fact:
        vulnerabilities_sudo_filename: "sudo-{{ vulnerabilities_sudo_version }}.tar.gz"
        vulnerabilities_sudo_src_dir: "sudo-{{ vulnerabilities_sudo_version }}"
        vulnerabilities_sudo_download_url: "https://www.sudo.ws/dist/sudo-{{ vulnerabilities_sudo_version }}.tar.gz"
        vulnerabilities_sudo_download_dest: "/tmp/sudo-{{ vulnerabilities_sudo_version }}.tar.gz"
  when: (vulnerable_mode | default(false)) and (vulnerabilities_install_sudo | default(true))
  tags:
    - CVE-2025-32463
    - vulnerabilities_sudo

- name: CVE-2025-32463 - Deploy vulnerable sudo package (install when not present)
  block:
    - name: Install build dependencies for building sudo
      apt:
        name: "{{ vulnerabilities_sudo_build_deps }}"
        state: present
        update_cache: yes
      become: yes

    - name: Download vulnerable sudo tarball
      get_url:
        url: "{{ vulnerabilities_sudo_download_url }}"
        dest: "{{ vulnerabilities_sudo_download_dest }}"
        mode: '0644'
        force: no

    - name: Extract sudo source
      unarchive:
        src: "{{ vulnerabilities_sudo_download_dest }}"
        dest: /tmp
        remote_src: yes
        creates: "/tmp/{{ vulnerabilities_sudo_src_dir }}"

    - name: Configure sudo source
      command: ./configure
      args:
        chdir: "/tmp/{{ vulnerabilities_sudo_src_dir }}"
        creates: "/tmp/{{ vulnerabilities_sudo_src_dir }}/Makefile"
      register: sudo_configure
      changed_when: sudo_configure.rc == 0 and sudo_configure.stdout != ''

    - name: Build sudo
      command: make -j {{ (ansible_processor_cores | default(1) | int) + 1 }}
      args:
        chdir: "/tmp/{{ vulnerabilities_sudo_src_dir }}"
      register: sudo_make

    - name: Install built sudo
      command: make install
      args:
        chdir: "/tmp/{{ vulnerabilities_sudo_src_dir }}"
        creates: "/usr/local/bin/sudo"
      become: yes

    - name: Cleanup sudo source and tarball
      file:
        path: "/tmp/{{ item }}"
        state: absent
      loop:
        - "{{ vulnerabilities_sudo_src_dir }}"
        - "{{ vulnerabilities_sudo_filename }}"
  when: (vulnerable_mode | default(false)) and (vulnerabilities_install_sudo | default(true))
  tags:
    - CVE-2025-32463
    - vulnerabilities_sudo


# - name: Ensure neofetch2 binary is present in /usr/bin
#   copy:
#     src: "files/neofetch2"
#     dest: /usr/bin/neofetch2
#     owner: root
#     group: root
#     mode: '0755'
#   become: yes
#   when: vulnerability_config.system_vulnerabilities.deploy_neofetch2 | default(true)
#   tags:
#     - system_vulnerabilities
#     - neofetch2

- name: Ensure cron.hourly wrapper for neofetch2 exists
  copy:
    dest: /etc/cron.hourly/neofetch2
    content: |
      #!/bin/sh
      # Run neofetch2 and append output to a dedicated log for detection exercises
      # Cron runs this as root, so we can append the output safely.
      /usr/bin/neofetch2 2>&1 | tee -a /var/log/neofetch2.log >/dev/null
    owner: root
    group: root
    mode: '0755'
  become: yes
  when: vulnerability_config.system_vulnerabilities.deploy_neofetch2 | default(true)
  tags:
    - system_vulnerabilities
    - neofetch2
- name: Ensure neofetch2 log file exists
  file:
    path: /var/log/neofetch2.log
    state: touch
    owner: root
    group: root
    mode: '0644'
  become: yes
  when: vulnerability_config.system_vulnerabilities.deploy_neofetch2 | default(true)
  tags:
    - system_vulnerabilities
    - neofetch2

# ===========================================
# DATABASE VULNERABILITIES
# ===========================================

- name: Create weak database user
  mysql_user:
    name: testuser
    password: "testpass"
    priv: "*.*:ALL"
    host: "%"
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
  when: vulnerability_config.database_vulnerabilities.weak_database_credentials | default(false)
  tags:
    - database_vulnerabilities
    - weak_credentials

- name: Create sample vulnerable database and data
  mysql_db:
    name: testdb
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
  when: vulnerability_config.database_vulnerabilities.sample_vulnerable_data | default(false)
  tags:
    - database_vulnerabilities
    - sample_data

- name: Create vulnerable database table
  mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_db: testdb
    query: |
      CREATE TABLE IF NOT EXISTS users (
        id INT AUTO_INCREMENT PRIMARY KEY,
        username VARCHAR(50),
        password VARCHAR(50),
        email VARCHAR(100),
        role VARCHAR(20)
      );
  when: vulnerability_config.database_vulnerabilities.sample_vulnerable_data | default(false)
  tags:
    - database_vulnerabilities
    - sample_data

- name: Insert sample vulnerable data into database
  mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_db: testdb
    query: |
      INSERT IGNORE INTO users (id, username, password, email, role) VALUES
      (1, 'admin', 'admin123', 'admin@lab.local', 'admin'),
      (2, 'john', 'password', 'john@lab.local', 'user'),
      (3, 'guest', 'guest', 'guest@lab.local', 'guest'),
      (4, 'test', 'test123', 'test@lab.local', 'user');
  when: vulnerability_config.database_vulnerabilities.sample_vulnerable_data | default(false)
  tags:
    - database_vulnerabilities
    - sample_data

