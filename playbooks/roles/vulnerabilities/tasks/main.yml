---
# Vulnerabilities Role - Granular vulnerability controls based on profile configuration
# Each vulnerability type can be individually enabled/disabled using profile settings

# ===========================================
# CLEANUP VULNERABILITIES
# ===========================================

- name: Force cleanup of all vulnerability files for clean deployment
  block:
    - name: Remove entire vulnerability override directory
      file:
        path: /var/www/roles/vulnerabilities/web_stack
        state: absent
    
    - name: Reset database passwords to secure defaults
      mysql_query:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_db: testdb
        query: |
          UPDATE users SET password = '{{ item.password }}'
          WHERE username = '{{ item.username }}';
      loop:
        - { username: 'admin', password: 'Admin@Secure123!' }
        - { username: 'jane', password: 'Jane@Secure456!' }
        - { username: 'guest', password: 'Guest@Secure789!' }
      ignore_errors: yes
  when: not (vulnerable_mode | default(false))
  tags:
    - cleanup

# ===========================================
# SELECTIVE CLEANUP VULNERABILITIES
# ===========================================

- name: Remove API vulnerability files when individually disabled
  file:
    path: "/var/www/roles/vulnerabilities/web_stack/{{ item.file }}"
    state: absent
  loop:
    - { file: 'ssrf.php', enabled: "{{ vulnerability_config.api_vulnerabilities.ssrf | default(false) }}" }
    - { file: 'exposed_diagnostics.php', enabled: "{{ vulnerability_config.api_vulnerabilities.exposed_diagnostics | default(false) }}" }
    - { file: 'exposed_test_endpoints.php', enabled: "{{ vulnerability_config.api_vulnerabilities.exposed_test_endpoints | default(false) }}" }
    - { file: 'insecure_tokens.php', enabled: "{{ vulnerability_config.api_vulnerabilities.insecure_tokens | default(false) }}" }
    - { file: 'verbose_error_messages.php', enabled: "{{ vulnerability_config.api_vulnerabilities.verbose_error_messages | default(false) }}" }
  when: 
    - vulnerable_mode | default(false)
    - not item.enabled
  tags:
    - cleanup
    - selective_cleanup
    - api_vulnerabilities
    
# NOTE: Individual vulnerability files removed - LabSys Wiki now provides comprehensive web vulnerability testing

- name: Configure PHP to display errors
  lineinfile:
    path: /etc/php/{{ php_version }}/apache2/php.ini
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    backup: yes
  loop:
    - { regexp: '^display_errors\s*=', line: 'display_errors = On' }
    - { regexp: '^display_startup_errors\s*=', line: 'display_startup_errors = On' }
    - { regexp: '^error_reporting\s*=', line: 'error_reporting = E_ALL' }
    - { regexp: '^log_errors\s*=', line: 'log_errors = On' }
    - { regexp: '^error_log\s*=', line: 'error_log = /var/log/php_errors.log' }
  notify: restart apache
  tags: php_errors

- name: Enable Apache server-info and server-status (info disclosure)
  copy:
    src: "{{ playbook_dir }}/files/configs/server-info.conf"
    dest: /etc/apache2/conf-available/server-info.conf
  when: vulnerability_config.web_vulnerabilities.info_disclosure | default(false)
  notify: restart apache
  tags:
    - web_vulnerabilities
    - info_disclosure

- name: Enable server-info configuration
  command: a2enconf server-info
  when: vulnerability_config.web_vulnerabilities.info_disclosure | default(false)
  notify: restart apache
  tags:
    - web_vulnerabilities
    - info_disclosure

# ===========================================
