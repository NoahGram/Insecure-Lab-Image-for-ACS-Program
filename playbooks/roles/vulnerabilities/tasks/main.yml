- name: Set insecure passwords in database for vulnerable deployment
  mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_db: testdb
    query: |
      UPDATE users SET password = '{{ item.password }}'
      WHERE username = '{{ item.username }}';
  loop:
    - { username: 'admin', password: 'admin' }
    - { username: 'jane', password: 'jane' }
    - { username: 'guest', password: 'guest' }
  ignore_errors: yes
