- name: Create old rotated log with historical credentials
  copy:
    src: "{{ playbook_dir }}/files/logs/migration.log.old"
    dest: /tmp/log/migration.log.old
    mode: '0644'
    owner: root
    group: root
  when: vulnerability_config.system_vulnerabilities.exposed_log_files | default(false)
  tags:
    - system_vulnerabilities
    - exposed_logs

# NO LOGIN LOCK

- name: Deploy no login lock vulnerability override
  copy:
    src: files/no_login_lock.php
    dest: /var/www/html/labsys-wiki/includes/modules/login_helpers.php
    owner: www-data
    group: www-data
    mode: '0644'
  when: vulnerable_mode | default(false)

- name: Remove failed_attempts and last_failed columns in vulnerable mode
  mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_db: wikidb
    query: |
      ALTER TABLE users
        DROP COLUMN IF EXISTS failed_attempts,
        DROP COLUMN IF EXISTS last_failed;
  when: vulnerable_mode | default(false)

  # NO PASSWORD VALIDATION

- name: Deploy no server-side password validation
  copy:
    src: files/no_password_validation.php
    dest: /var/www/html/labsys-wiki/includes/modules/password_validation.php
    owner: www-data
    group: www-data
    mode: '0644'
  when: vulnerable_mode | default(false)

- name: Remove client-side password validation
  file:
    path: /var/www/html/labsys-wiki/assets/js/register.js
    state: absent
  when: vulnerable_mode | default(false)

- name: Set insecure passwords in database for vulnerable deployment
  mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_db: wikidb
    query: |
      UPDATE users SET password = '{{ item.password }}'
      WHERE username = '{{ item.username }}';
  loop:
    - { username: 'mcarter',   password: 'Password1' }
    - { username: 'slopez',    password: 'sunshine' }
    - { username: 'tnguyen',   password: 'Welcome123' }
    - { username: 'ajohnson',  password: 'qwerty12' }
    - { username: 'dpatel',    password: 'iloveyou' }
    - { username: 'lwilson',   password: 'letmein' }
    - { username: 'kroberts',  password: 'IronGate$558' }
    - { username: 'hkim',     password: 'Nova*Cloud73' }
  ignore_errors: yes
  when: vulnerable_mode | default(false)

# HIDDEN FIELD

- name: Add hidden role field
  blockinfile:
    path: /var/www/html/labsys-wiki/templates/register.php
    marker: ""
    insertafter: '<input id="email" name="email" type="email" required>'
    block: |
      <input type="hidden" name="role" value="user">
  when: vulnerable_mode | default(false)

- name: Enable vulnerable role assignment
  replace:
    path: /var/www/html/labsys-wiki/includes/actions.php
    regexp: "\\$role\\s*=\\s*'user';\\s*// default registration role"
    replace: |
      $role = $_REQUEST['role'] ?? 'user';

      $allowed_roles = ['user', 'admin'];
      if (!in_array($role, $allowed_roles, true)) {
          $role = 'user';
      }
  when: vulnerable_mode | default(false)

# EDITABLE URL PARAMETER

- name: Deploy editable url paramater
  copy:
    src: files/editable_url_parameters.php
    dest: /var/www/html/labsys-wiki/includes/modules/authorization.php
    owner: www-data
    group: www-data
    mode: '0644'
  when: vulnerable_mode | default(false)

# CRYPTOGRAPHY FAILURES
- name: Deploy md5 password verification
  copy:
    src: files/cryptographic_failures.php
    dest: /var/www/html/labsys-wiki/includes/modules/verify_password.php
    owner: www-data
    group: www-data
    mode: '0644'
  when: vulnerable_mode | default(false)

# CSRF

- name: Deploy disable session cookies vulnerability override
  copy:
    src: files/disable_session_cookies.php
    dest: /var/www/html/labsys-wiki/includes/init_session.php
    owner: www-data
    group: www-data
    mode: '0644'
  when: vulnerable_mode | default(false)

- name: Remove csrf protection
  file:
    path: /var/www/html/labsys-wiki/includes/modules/csrf_protection.php
    state: absent
  when: vulnerable_mode | default(false)

- name: Remove enforce_csrf() calls in vulnerable mode
  ansible.builtin.lineinfile:
    path: /var/www/html/labsys-wiki/includes/actions.php
    regexp: "^\\s*enforce_csrf\\(\\s*'[^']*'\\s*\\);"
    state: absent
  when: vulnerable_mode | default(false)

- name: Remove csrf_protection require in vulnerable mode
  ansible.builtin.lineinfile:
    path: /var/www/html/labsys-wiki/includes/actions.php
    regexp: "^\\s*require_once\\s+__DIR__\\s*\\.\\s*'/modules/csrf_protection\\.php';"
    state: absent
  when: vulnerable_mode | default(false)

- name: Remove CSRF token generation in vulnerable mode
  lineinfile:
    path: /var/www/html/labsys-wiki/includes/actions.php
    regexp: "^\\s*\\$_SESSION\\['csrf_token'\\]\\s*=\\s*bin2hex\\(random_bytes\\(32\\)\\);\\s*$"
    state: absent
  when: vulnerable_mode | default(false)

- name: Remove any line containing csrf_field() in vulnerable mode
  lineinfile:
    path: "/var/www/html/labsys-wiki/{{ item }}"
    regexp: "csrf_field\\s*\\("
    state: absent
  loop:
    - templates/register.php
    - templates/login.php
    - templates/edit.php
    - index.php
  when: vulnerable_mode | default(false)

# SESSION FIXATION

- name: Remove session_regenerate_id(true) calls in vulnerable mode
  lineinfile:
    path: /var/www/html/labsys-wiki/includes/actions.php
    regexp: '^\s*session_regenerate_id\s*\(\s*true\s*\)\s*;\s*$'
    state: absent
  when: vulnerable_mode | default(false)

# ===========================================
# APPLICATION VULNERABILITIES - DokuWiki
# ===========================================

- name: Configure DokuWiki media handler
  template:
    src: templates/dokuwiki-media.conf.j2
    dest: /etc/apache2/conf-available/dokuwiki-media.conf
    owner: root
    group: root
    mode: '0644'
  when: vulnerability_config.application_vulnerabilities.dokuwiki_svg_rce | default(false)
  notify: restart apache
  tags:
    - application_vulnerabilities
    - dokuwiki

- name: Enable DokuWiki media configuration
  command: a2enconf dokuwiki-media
  args:
    creates: /etc/apache2/conf-enabled/dokuwiki-media.conf
  when: vulnerability_config.application_vulnerabilities.dokuwiki_svg_rce | default(false)
  notify: restart apache
  tags:
    - application_vulnerabilities
    - dokuwiki

- name: Disable DokuWiki media configuration
  command: a2disconf dokuwiki-media
  args:
    removes: /etc/apache2/conf-enabled/dokuwiki-media.conf
  when: not (vulnerability_config.application_vulnerabilities.dokuwiki_svg_rce | default(false))
  notify: restart apache
  failed_when: false
  tags:
    - application_vulnerabilities
    - dokuwiki

- name: Ensure DokuWiki root media namespace directory exists
  file:
    path: /var/www/dokuwiki/data/media/0
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  when: vulnerability_config.application_vulnerabilities.dokuwiki_svg_rce | default(false)
  tags:
    - application_vulnerabilities
    - dokuwiki
