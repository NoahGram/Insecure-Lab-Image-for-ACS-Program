# ===========================================
# SYSTEM VULNERABILITIES
# ===========================================

- name: Set SUID on python3 interpreter
  block:
    - name: Locate python3 binary
      command: which python3
      register: python3_path
      changed_when: false
      failed_when: false

    - name: Set SUID bit on python3
      file:
        path: "{{ python3_path.stdout }}"
        mode: '4755'
        owner: root
        group: root
      become: true
      when: python3_path.rc == 0

  when: vulnerability_config.system_vulnerabilities.setuid_python3 | default(true)
  tags:
    - system_vulnerabilities
    - setuid_python3

# Note: Main user accounts are created in user_environment role
# This task only ensures weak passwords for the vulnerability scenario
- name: Ensure weak passwords on accounts (vulnerability scenario)
  user:
    name: "{{ item.name }}"
    password: "{{ item.password | password_hash('sha512') }}"
  loop:
    - { name: "guest", password: "guest" }
  when: vulnerability_config.system_vulnerabilities.weak_user_accounts | default(false)
  tags:
    - system_vulnerabilities
    - weak_accounts

- name: Add dangerous sudo privileges
  lineinfile:
    path: /etc/sudoers
    line: "{{ item }}"
    validate: 'visudo -cf %s'
  loop:
    - "mike ALL=(ALL) NOPASSWD:ALL"
  when: vulnerability_config.system_vulnerabilities.sudo_misconfiguration | default(false)
  tags:
    - system_vulnerabilities
    - sudo_misconfiguration

- name: Configure Apache with verbose server information
  lineinfile:
    path: /etc/apache2/apache2.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: "^ServerTokens", line: "ServerTokens Full" }
    - { regexp: "^ServerSignature", line: "ServerSignature On" }
  when: vulnerability_config.system_vulnerabilities.service_information_disclosure | default(false)
  notify: restart apache
  tags:
    - system_vulnerabilities
    - service_disclosure

- name: Create world-writable test files
  file:
    path: "{{ item }}"
    state: touch
    mode: '0666'
    owner: www-data
    group: www-data
  loop:
    - /var/www/html/writable_file.txt
    - /tmp/weak_permissions.log
  when: vulnerability_config.system_vulnerabilities.weak_file_permissions | default(false)
  tags:
    - system_vulnerabilities
    - weak_permissions

