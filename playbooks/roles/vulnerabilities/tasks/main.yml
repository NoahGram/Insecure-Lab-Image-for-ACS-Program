# ===========================================
# SYSTEM VULNERABILITIES
# ===========================================

- name: Create weak user accounts
  user:
    name: "{{ item.name }}"
    password: "{{ item.password | password_hash('sha512') }}"
    shell: /bin/bash
    create_home: yes
    comment: "Vulnerable test account"
  loop:
    - { name: "admin", password: "admin" }
    - { name: "test", password: "test" }
    - { name: "guest", password: "guest" }
    - { name: "demo", password: "demo" }
  when: vulnerability_config.system_vulnerabilities.weak_user_accounts | default(false)
  tags:
    - system_vulnerabilities
    - weak_accounts

- name: Add dangerous sudo privileges
  lineinfile:
    path: /etc/sudoers
    line: "{{ item }}"
    validate: 'visudo -cf %s'
  loop:
    - "admin ALL=(ALL) NOPASSWD:ALL"
    - "test ALL=(ALL) ALL"
  when: vulnerability_config.system_vulnerabilities.sudo_misconfiguration | default(false)
  tags:
    - system_vulnerabilities
    - sudo_misconfiguration

- name: Configure Apache with verbose server information
  lineinfile:
    path: /etc/apache2/apache2.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: "^ServerTokens", line: "ServerTokens Full" }
    - { regexp: "^ServerSignature", line: "ServerSignature On" }
  when: vulnerability_config.system_vulnerabilities.service_information_disclosure | default(false)
  notify: restart apache
  tags:
    - system_vulnerabilities
    - service_disclosure

- name: Create world-writable test files
  file:
    path: "{{ item }}"
    state: touch
    mode: '0666'
    owner: www-data
    group: www-data
  loop:
    - /var/www/html/writable_file.txt
    - /tmp/weak_permissions.log
  when: vulnerability_config.system_vulnerabilities.weak_file_permissions | default(false)
  tags:
    - system_vulnerabilities
    - weak_permissions

- name: CVE-2025-32463 - Deploy vulnerable sudo package (prepare variables and check)
  block:
    - name: Set sudo vulnerability base parameters
      set_fact:
        vulnerabilities_install_sudo: true
        vulnerabilities_sudo_version: "1.9.15p5"
        vulnerabilities_sudo_build_deps:
          - build-essential
          - libpam0g-dev
          - libselinux1-dev
          - libssl-dev
          - pkg-config

    - name: Set sudo filenames and download paths
      set_fact:
        vulnerabilities_sudo_filename: "sudo-{{ vulnerabilities_sudo_version }}.tar.gz"
        vulnerabilities_sudo_src_dir: "sudo-{{ vulnerabilities_sudo_version }}"
        vulnerabilities_sudo_download_url: "https://www.sudo.ws/dist/sudo-{{ vulnerabilities_sudo_version }}.tar.gz"
        vulnerabilities_sudo_download_dest: "/tmp/sudo-{{ vulnerabilities_sudo_version }}.tar.gz"
  when: (vulnerable_mode | default(false)) and (vulnerabilities_install_sudo | default(true))
  tags:
    - CVE-2025-32463
    - vulnerabilities_sudo

- name: CVE-2025-32463 - Deploy vulnerable sudo package (install when not present)
  block:
    - name: Install build dependencies for building sudo
      apt:
        name: "{{ vulnerabilities_sudo_build_deps }}"
        state: present
        update_cache: yes
      become: yes

    - name: Download vulnerable sudo tarball
      get_url:
        url: "{{ vulnerabilities_sudo_download_url }}"
        dest: "{{ vulnerabilities_sudo_download_dest }}"
        mode: '0644'
        force: no

    - name: Extract sudo source
      unarchive:
        src: "{{ vulnerabilities_sudo_download_dest }}"
        dest: /tmp
        remote_src: yes
        creates: "/tmp/{{ vulnerabilities_sudo_src_dir }}"

    - name: Configure sudo source
      command: ./configure
      args:
        chdir: "/tmp/{{ vulnerabilities_sudo_src_dir }}"
      register: sudo_configure
      changed_when: "sudo_configure.rc == 0 and sudo_configure.stdout != ''"

    - name: Build sudo
      command: make -j {{ ansible_processor_cores | default(1) }}
      args:
        chdir: "/tmp/{{ vulnerabilities_sudo_src_dir }}"
      register: sudo_make
      changed_when: "sudo_make.rc == 0"

    - name: Install built sudo
      command: make install
      args:
        chdir: "/tmp/{{ vulnerabilities_sudo_src_dir }}"
      become: yes

    - name: Cleanup sudo source and tarball
      file:
        path: "/tmp/{{ item }}"
        state: absent
      loop:
        - "{{ vulnerabilities_sudo_src_dir }}"
        - "{{ vulnerabilities_sudo_filename }}"
  when: (vulnerable_mode | default(false)) and (vulnerabilities_install_sudo | default(true))
  tags:
    - CVE-2025-32463
    - vulnerabilities_sudo

# ===========================================
# DATABASE VULNERABILITIES
# ===========================================

- name: Create weak database user
  mysql_user:
    name: testuser
    password: "testpass"
    priv: "*.*:ALL"
    host: "%"
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
  when: vulnerability_config.database_vulnerabilities.weak_database_credentials | default(false)
  tags:
    - database_vulnerabilities
    - weak_credentials

- name: Create sample vulnerable database and data
  mysql_db:
    name: testdb
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
  when: vulnerability_config.database_vulnerabilities.sample_vulnerable_data | default(false)
  tags:
    - database_vulnerabilities
    - sample_data

- name: Create vulnerable database table
  mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_db: testdb
    query: |
      CREATE TABLE IF NOT EXISTS users (
        id INT AUTO_INCREMENT PRIMARY KEY,
        username VARCHAR(50),
        password VARCHAR(50),
        email VARCHAR(100),
        role VARCHAR(20)
      );
  when: vulnerability_config.database_vulnerabilities.sample_vulnerable_data | default(false)
  tags:
    - database_vulnerabilities
    - sample_data

- name: Insert sample vulnerable data into database
  mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_db: testdb
    query: |
      INSERT IGNORE INTO users (id, username, password, email, role) VALUES
      (1, 'admin', 'admin123', 'admin@lab.local', 'admin'),
      (2, 'john', 'password', 'john@lab.local', 'user'),
      (3, 'guest', 'guest', 'guest@lab.local', 'guest'),
      (4, 'test', 'test123', 'test@lab.local', 'user');
  when: vulnerability_config.database_vulnerabilities.sample_vulnerable_data | default(false)
  tags:
    - database_vulnerabilities
    - sample_data

