---
# Vulnerabilities Role - Granular vulnerability controls based on profile configuration
# Each vulnerability type can be individually enabled/disabled using profile settings

# ===========================================
# WEB VULNERABILITIES
# ===========================================



- name: Create vulnerable upload directory
  file:
    path: /var/www/html/uploads
    state: directory
    owner: www-data
    group: www-data
    mode: '0777'
  when: vulnerability_config.web_vulnerabilities.file_upload_bypass | default(false)
  tags:
    - web_vulnerabilities
    - file_upload

- name: Create file upload bypass vulnerable page
  copy:
    src: "{{ playbook_dir }}/files/web/file_upload.php"
    dest: /var/www/html/file_upload.php
    owner: www-data
    group: www-data
    mode: '0644'
  when: vulnerability_config.web_vulnerabilities.file_upload_bypass | default(false)
  tags:
    - web_vulnerabilities
    - file_upload

- name: Enable Apache server-info and server-status (info disclosure)
  copy:
    src: "{{ playbook_dir }}/files/configs/server-info.conf"
    dest: /etc/apache2/conf-available/server-info.conf
  when: vulnerability_config.web_vulnerabilities.info_disclosure | default(false)
  notify: restart apache
  tags:
    - web_vulnerabilities
    - info_disclosure

- name: Enable server-info configuration
  command: a2enconf server-info
  when: vulnerability_config.web_vulnerabilities.info_disclosure | default(false)
  notify: restart apache
  tags:
    - web_vulnerabilities
    - info_disclosure

- name: Create phpinfo disclosure page
  copy:
    src: "{{ playbook_dir }}/files/web/info.php"
    dest: /var/www/html/info.php
    owner: www-data
    group: www-data
    mode: '0644'
  when: vulnerability_config.web_vulnerabilities.info_disclosure | default(false)
  tags:
    - web_vulnerabilities
    - info_disclosure

- name: Create command injection vulnerable page
  copy:
    src: "{{ playbook_dir }}/files/web/command_injection.php"
    dest: /var/www/html/command_injection.php
    owner: www-data
    group: www-data
    mode: '0644'
  when: vulnerability_config.web_vulnerabilities.command_injection | default(false)
  tags:
    - web_vulnerabilities
    - command_injection

- name: Create path traversal vulnerable page
  copy:
    src: "{{ playbook_dir }}/files/web/path_traversal.php"
    dest: /var/www/html/path_traversal.php
    owner: www-data
    group: www-data
    mode: '0644'
  when: vulnerability_config.web_vulnerabilities.path_traversal | default(false)
  tags:
    - web_vulnerabilities
    - path_traversal

# ===========================================
# SYSTEM VULNERABILITIES
# ===========================================

- name: Create weak user accounts
  user:
    name: "{{ item.name }}"
    password: "{{ item.password | password_hash('sha512') }}"
    shell: /bin/bash
    create_home: yes
    comment: "Vulnerable test account"
  loop:
    - { name: "admin", password: "admin" }
    - { name: "test", password: "test" }
    - { name: "guest", password: "guest" }
    - { name: "demo", password: "demo" }
  when: vulnerability_config.system_vulnerabilities.weak_user_accounts | default(false)
  tags:
    - system_vulnerabilities
    - weak_accounts

- name: Add dangerous sudo privileges
  lineinfile:
    path: /etc/sudoers
    line: "{{ item }}"
    validate: 'visudo -cf %s'
  loop:
    - "admin ALL=(ALL) NOPASSWD:ALL"
    - "test ALL=(ALL) ALL"
  when: vulnerability_config.system_vulnerabilities.sudo_misconfiguration | default(false)
  tags:
    - system_vulnerabilities
    - sudo_misconfiguration

- name: Configure Apache with verbose server information
  lineinfile:
    path: /etc/apache2/apache2.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: "^ServerTokens", line: "ServerTokens Full" }
    - { regexp: "^ServerSignature", line: "ServerSignature On" }
  when: vulnerability_config.system_vulnerabilities.service_information_disclosure | default(false)
  notify: restart apache
  tags:
    - system_vulnerabilities
    - service_disclosure

- name: Create world-writable test files
  file:
    path: "{{ item }}"
    state: touch
    mode: '0666'
    owner: www-data
    group: www-data
  loop:
    - /var/www/html/writable_file.txt
    - /tmp/weak_permissions.log
  when: vulnerability_config.system_vulnerabilities.weak_file_permissions | default(false)
  tags:
    - system_vulnerabilities
    - weak_permissions

# ===========================================
# DATABASE VULNERABILITIES
# ===========================================

- name: Create weak database user
  mysql_user:
    name: testuser
    password: "testpass"
    priv: "*.*:ALL"
    host: "%"
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
  when: vulnerability_config.database_vulnerabilities.weak_database_credentials | default(false)
  tags:
    - database_vulnerabilities
    - weak_credentials

- name: Create sample vulnerable database and data
  mysql_db:
    name: testdb
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
  when: vulnerability_config.database_vulnerabilities.sample_vulnerable_data | default(false)
  tags:
    - database_vulnerabilities
    - sample_data

- name: Create vulnerable database table
  mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_db: testdb
    query: |
      CREATE TABLE IF NOT EXISTS users (
        id INT AUTO_INCREMENT PRIMARY KEY,
        username VARCHAR(50),
        password VARCHAR(50),
        email VARCHAR(100),
        role VARCHAR(20)
      );
  when: vulnerability_config.database_vulnerabilities.sample_vulnerable_data | default(false)
  tags:
    - database_vulnerabilities
    - sample_data

- name: Insert sample vulnerable data into database
  mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_db: testdb
    query: |
      INSERT IGNORE INTO users (id, username, password, email, role) VALUES
      (1, 'admin', 'admin123', 'admin@lab.local', 'admin'),
      (2, 'john', 'password', 'john@lab.local', 'user'),
      (3, 'guest', 'guest', 'guest@lab.local', 'guest'),
      (4, 'test', 'test123', 'test@lab.local', 'user');
  when: vulnerability_config.database_vulnerabilities.sample_vulnerable_data | default(false)
  tags:
    - database_vulnerabilities
    - sample_data

# ===========================================
# APPLICATION VULNERABILITIES
# ===========================================

- name: Deploy comprehensive vulnerable web application
  copy:
    src: "{{ role_path }}/web_stack/actions_vulnerable.php"
    dest: /var/www/html/actions_vulnerable.php
    owner: www-data
    group: www-data
    mode: '0644'
  when: vulnerability_config.application_vulnerabilities.vulnerable_web_apps | default(false)
  tags:
    - application_vulnerabilities
    - vulnerable_apps

# ===========================================
# SYSTEM VULNERABILITIES - EXPOSED LOG FILES
# ===========================================

- name: Create exposed log directory
  file:
    path: /tmp/log
    state: directory
    mode: '0755'
    owner: root
    group: root
  when: vulnerability_config.system_vulnerabilities.exposed_log_files | default(false)
  tags:
    - system_vulnerabilities
    - exposed_logs

- name: Create application log with embedded credentials
  copy:
    src: "{{ playbook_dir }}/files/logs/application.log"
    dest: /tmp/log/application.log
    mode: '0644'
    owner: www-data
    group: www-data
  when: vulnerability_config.system_vulnerabilities.exposed_log_files | default(false)
  tags:
    - system_vulnerabilities
    - exposed_logs

- name: Create SSH session log with authentication details
  copy:
    src: "{{ playbook_dir }}/files/logs/auth.log"
    dest: /tmp/log/auth.log
    mode: '0640'
    owner: syslog
    group: adm
  when: vulnerability_config.system_vulnerabilities.exposed_log_files | default(false)
  tags:
    - system_vulnerabilities
    - exposed_logs

- name: Create backup script log with plaintext passwords
  copy:
    src: "{{ playbook_dir }}/files/logs/backup_script.log"
    dest: /tmp/log/backup_script.log
    mode: '0644'
    owner: backup
    group: backup
  when: vulnerability_config.system_vulnerabilities.exposed_log_files | default(false)
  tags:
    - system_vulnerabilities
    - exposed_logs

- name: Create network service configuration with credentials
  copy:
    src: "{{ playbook_dir }}/files/logs/network_config.log"
    dest: /tmp/log/service_config_backup.conf
    mode: '0600'
    owner: root
    group: root
  when: vulnerability_config.system_vulnerabilities.exposed_log_files | default(false)
  tags:
    - system_vulnerabilities
    - exposed_logs

- name: Create old rotated log with historical credentials
  copy:
    src: "{{ playbook_dir }}/files/logs/migration.log.old"
    dest: /tmp/log/migration.log.old
    mode: '0644'
    owner: root
    group: root
  when: vulnerability_config.system_vulnerabilities.exposed_log_files | default(false)
  tags:
    - system_vulnerabilities
    - exposed_logs

- name: Create vulnerabilities web_stack directory on target
  file:
    path: /var/www/roles/vulnerabilities/web_stack
