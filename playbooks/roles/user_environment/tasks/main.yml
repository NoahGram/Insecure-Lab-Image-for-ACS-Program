---
# User Environment Setup Tasks
# Creates realistic TechCorp Solutions user environment for pentesting training
# Domain: techcorp.local

# ===========================================
# USER GROUPS (Realistic Enterprise Structure)
# ===========================================

- name: Create enterprise user groups
  group:
    name: "{{ item }}"
    state: present
  loop:
    - it-department
    - operations
    - backup-operators
  tags:
    - user_environment
    - groups

# ===========================================
# SYSTEM USERS
# ===========================================

# Guest - Entry point for students
- name: Ensure guest user exists
  user:
    name: guest
    password: "{{ 'guest' | password_hash('sha512') }}"
    shell: /bin/bash
    create_home: yes
    comment: "TechCorp Guest Account - Intern Access"
    state: present
  tags:
    - user_environment

# Mike Thompson - IT Manager (was: admin)
- name: Create mike user (IT Manager)
  user:
    name: mike
    password: "{{ 'RedHat' | password_hash('sha512') }}"
    shell: /bin/bash
    create_home: yes
    comment: "Mike Thompson - IT Manager"
    groups: it-department,sudo
    append: yes
    state: present
  tags:
    - user_environment

# Linda Sanchez - Senior Sysadmin (was: sysadmin)
- name: Create linda user (Senior Sysadmin)
  user:
    name: linda
    password: "{{ 'Summer2024!' | password_hash('sha512') }}"
    shell: /bin/bash
    create_home: yes
    comment: "Linda Sanchez - Senior System Administrator"
    groups: it-department,operations,sudo
    append: yes
    state: present
  tags:
    - user_environment

# Backup service account
- name: Create backup user (Backup Operator)
  user:
    name: backup
    password: "{{ 'Backup2024!' | password_hash('sha512') }}"
    shell: /bin/bash
    create_home: yes
    comment: "Automated Backup Service Account"
    groups: backup-operators
    append: yes
    state: present
  tags:
    - user_environment

# ===========================================
# VAGRANT USER LOCKDOWN (Keep functional for Ansible)
# ===========================================

- name: Lock vagrant password for interactive login
  user:
    name: vagrant
    password_lock: yes
  ignore_errors: yes
  tags:
    - user_environment
    - vagrant_lockdown

- name: Create vagrant discovery artifact in /var/log
  copy:
    dest: /var/log/vagrant_provision.log
    mode: '0644'
    owner: root
    group: root
    content: |
      ========================================
      VAGRANT PROVISIONING LOG
      ========================================
      Date: {{ ansible_date_time.iso8601 }}
      Vagrant Version: 2.4.x
      Provider: VMware/VirtualBox
      Box: ubuntu/noble64
      
      This VM was provisioned using Vagrant for automated
      deployment. The vagrant user exists for provisioning
      purposes only.
      
      SSH Key Location: /home/vagrant/.ssh/authorized_keys
      
      ========================================
  tags:
    - user_environment
    - vagrant_lockdown

- name: Create hint file in vagrant home
  copy:
    dest: /home/vagrant/README.txt
    mode: '0644'
    owner: vagrant
    group: vagrant
    content: |
      ╔══════════════════════════════════════════════════════════════╗
      ║  VAGRANT PROVISIONING ACCOUNT                                ║
      ╠══════════════════════════════════════════════════════════════╣
      ║  This account is used for automated VM provisioning.         ║
      ║  Password login is disabled.                                 ║
      ╚══════════════════════════════════════════════════════════════╝
  ignore_errors: yes
  tags:
    - user_environment
    - vagrant_lockdown

# ===========================================
# HOME DIRECTORY STRUCTURE
# ===========================================

- name: Ensure user home directories exist with correct permissions
  file:
    path: "/home/{{ item.user }}"
    state: directory
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "{{ item.mode }}"
  loop:
    - { user: "guest", mode: "0755" }
    - { user: "mike", mode: "0750" }
    - { user: "linda", mode: "0750" }
    - { user: "backup", mode: "0750" }
  tags:
    - user_environment

- name: Create user-specific subdirectories
  file:
    path: "/home/{{ item.user }}/{{ item.dir }}"
    state: directory
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: '0755'
  loop:
    # Mike (IT Manager)
    - { user: "mike", dir: "scripts" }
    - { user: "mike", dir: "reports" }
    # Linda (Sysadmin)
    - { user: "linda", dir: "docs" }
    - { user: "linda", dir: "runbooks" }
    - { user: "linda", dir: "configs" }
    # Backup service
    - { user: "backup", dir: "backup_configs" }
  tags:
    - user_environment

# ===========================================
# USER FILES - BASHRC
# ===========================================

- name: Copy user bashrc files
  copy:
    src: "{{ playbook_dir }}/files/user_files/{{ item }}/.bashrc"
    dest: "/home/{{ item }}/.bashrc"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: '0644'
  loop:
    - guest
    - mike
    - linda
    - backup
  tags:
    - user_environment

- name: Fix line endings in bashrc files (Windows CRLF to Unix LF)
  replace:
    path: "/home/{{ item }}/.bashrc"
    regexp: '\r'
    replace: ''
  loop:
    - guest
    - mike
    - linda
    - backup
  tags:
    - user_environment

# ===========================================
# GUEST USER FILES
# ===========================================

- name: Copy guest user files
  copy:
    src: "{{ playbook_dir }}/files/user_files/guest/{{ item }}"
    dest: "/home/guest/{{ item }}"
    owner: guest
    group: guest
    mode: '0644'
  loop:
    - welcome.txt
    - linux_commands.txt
  tags:
    - user_environment
    - guest_files

# ===========================================
# MIKE (IT Manager) USER FILES
# ===========================================

- name: Copy mike user files
  copy:
    src: "{{ playbook_dir }}/files/user_files/mike/{{ item.src }}"
    dest: "/home/mike/{{ item.dest }}"
    owner: mike
    group: mike
    mode: "{{ item.mode }}"
  loop:
    - { src: "backup_script.sh", dest: "scripts/backup_script.sh", mode: "0755" }
    - { src: "admin_notes.txt", dest: "admin_notes.txt", mode: "0644" }
    - { src: "credentials.txt", dest: "credentials.txt", mode: "0600" }
  tags:
    - user_environment
    - mike_files

# ===========================================
# LINDA (Senior Sysadmin) USER FILES
# ===========================================

- name: Copy linda user files
  copy:
    src: "{{ playbook_dir }}/files/user_files/linda/{{ item.src }}"
    dest: "/home/linda/{{ item.dest }}"
    owner: linda
    group: linda
    mode: "{{ item.mode }}"
  loop:
    - { src: "system_health.sh", dest: "system_health.sh", mode: "0755" }
    - { src: "daily_log.txt", dest: "daily_log.txt", mode: "0644" }
  tags:
    - user_environment
    - linda_files

# ===========================================
# BACKUP SERVICE ACCOUNT FILES
# ===========================================

- name: Copy backup user files
  copy:
    src: "{{ playbook_dir }}/files/user_files/backup/{{ item.src }}"
    dest: "/home/backup/{{ item.dest }}"
    owner: backup
    group: backup
    mode: "{{ item.mode }}"
  loop:
    - { src: "automated_backup.sh", dest: "automated_backup.sh", mode: "0755" }
    - { src: "backup_config.txt", dest: "backup_configs/backup_config.txt", mode: "0600" }
  tags:
    - user_environment
    - backup_files

- name: Create backup directory structure
  file:
    path: /backup
    state: directory
    owner: backup
    group: backup
    mode: '0755'
  tags:
    - user_environment
    - backup_files

# ===========================================
# SCRIPT PERMISSIONS
# ===========================================

- name: Set executable permissions on scripts
  file:
    path: "{{ item }}"
    mode: '0755'
  loop:
    - /home/mike/scripts/backup_script.sh
    - /home/linda/system_health.sh
    - /home/backup/automated_backup.sh
  ignore_errors: yes
  tags:
    - user_environment

# ===========================================
# MAILDIR SETUP (For Postfix/Dovecot/Roundcube)
# ===========================================

- name: Create Maildir structure for all users
  shell: |
    for user in guest mike linda backup; do
      mkdir -p /home/$user/Maildir/{cur,new,tmp}
      chown -R $user:$user /home/$user/Maildir
      chmod -R 700 /home/$user/Maildir
    done
  args:
    creates: /home/mike/Maildir/cur
  tags:
    - user_environment
    - email

# ===========================================
# EMAIL ALIASES (techcorp.local domain)
# ===========================================

- name: Configure email aliases for realistic addresses
  lineinfile:
    path: /etc/aliases
    line: "{{ item }}"
    create: yes
  loop:
    - "mike.thompson: mike"
    - "m.thompson: mike"
    - "it-manager: mike"
    - "linda.sanchez: linda"
    - "l.sanchez: linda"
    - "sysadmin: linda"
    - "backup-service: backup"
    - "intern: guest"
  notify: rebuild aliases
  tags:
    - user_environment
    - email

# ===========================================
# MOTD (Message of the Day) - TechCorp Branding
# ===========================================

- name: Disable default Ubuntu MOTD scripts
  file:
    path: "/etc/update-motd.d/{{ item }}"
    state: absent
  loop:
    - 10-help-text
    - 50-motd-news
    - 91-contract-ua-esm-status
    - 95-hwe-eol
  ignore_errors: yes
  tags:
    - user_environment
    - motd

- name: Create custom MOTD header - TechCorp Branding
  copy:
    dest: /etc/update-motd.d/00-techcorp-header
    mode: '0755'
    content: |
      #!/bin/bash
      echo ""
      echo "  ╔════════════════════════════════════════════════════════════════════════╗"
      echo "  ║                                                                        ║"
      echo "  ║   ████████╗███████╗ ██████╗██╗  ██╗ ██████╗ ██████╗ ██████╗  ██████╗   ║"
      echo "  ║   ╚══██╔══╝██╔════╝██╔════╝██║  ██║██╔════╝██╔═══██╗██╔══██╗ ██╔══██╗  ║"
      echo "  ║      ██║   █████╗  ██║     ███████║██║     ██║   ██║██████╔╝ ██████╔╝  ║"
      echo "  ║      ██║   ██╔══╝  ██║     ██╔══██║██║     ██║   ██║██╔══██╗ ██╔═══╝   ║"
      echo "  ║      ██║   ███████╗╚██████╗██║  ██║╚██████╗╚██████╔╝██║  ██║ ██║       ║"
      echo "  ║      ╚═╝   ╚══════╝ ╚═════╝╚═╝  ╚═╝ ╚═════╝ ╚═════╝ ╚═╝  ╚═╝ ╚═╝       ║"
      echo "  ║                               SOLUTIONS                                ║"
      echo "  ║                                                                        ║"
      echo "  ╠════════════════════════════════════════════════════════════════════════╣"
      echo "  ║  Internal Development Server - lab.techcorp.local                      ║"
      echo "  ║  Authorized personnel only. All activity is logged.                    ║"
      echo "  ╚════════════════════════════════════════════════════════════════════════╝"
      echo ""
  tags:
    - user_environment
    - motd

- name: Create custom system info MOTD
  copy:
    dest: /etc/update-motd.d/10-techcorp-sysinfo
    mode: '0755'
    content: |
      #!/bin/bash
      echo "  System Information:"
      echo "  ────────────────────────────────────────────────────────────────"
      printf "  %-20s %s\n" "Hostname:" "$(hostname)"
      printf "  %-20s %s\n" "Domain:" "techcorp.local"
      printf "  %-20s %s\n" "IP Address:" "$(hostname -I | awk '{print $1}')"
      printf "  %-20s %s\n" "Kernel:" "$(uname -r)"
      printf "  %-20s %s\n" "Uptime:" "$(uptime -p | sed 's/up //')"
      echo ""
  tags:
    - user_environment
    - motd

- name: Create available services MOTD
  copy:
    dest: /etc/update-motd.d/20-techcorp-services
    mode: '0755'
    content: |
      #!/bin/bash
      echo "  TechCorp Internal Services:"
      echo "  ────────────────────────────────────────────────────────────────"
      echo "  • LabSys Wiki        : http://localhost:8080/labsys-wiki/"
      echo "  • Webmail (Roundcube): http://localhost:8080/roundcube/"
      echo "  • phpMyAdmin         : http://localhost:8080/phpmyadmin/"
      echo "  • Gitea              : http://localhost:3000"
      echo "  • Cockpit            : https://localhost:9090"
      echo ""
      echo "  IT Support: it-support@techcorp.local"
      echo "  ════════════════════════════════════════════════════════════════"
      echo ""
  tags:
    - user_environment
    - motd

# ===========================================
# REMOVE OLD USERS (Cleanup)
# ===========================================

- name: Remove deprecated users (test, demo, admin, sysadmin)
  user:
    name: "{{ item }}"
    state: absent
    remove: yes
  loop:
    - test
    - demo
    - admin
    - sysadmin
  ignore_errors: yes
  tags:
    - user_environment
    - cleanup

# ===========================================
# SYSTEM USERS MAIL SETUP (after users exist)
# ===========================================

- name: Create Maildir structure for system users
  file:
    path: "/home/{{ item.0 }}/Maildir/{{ item.1 }}"
    state: directory
    owner: "{{ item.0 }}"
    group: "{{ item.0 }}"
    mode: '0700'
  loop: "{{ ['guest', 'mike', 'linda', 'backup'] | product(['', 'new', 'cur', 'tmp']) | list }}"
  tags:
    - user_environment
    - mail_users

