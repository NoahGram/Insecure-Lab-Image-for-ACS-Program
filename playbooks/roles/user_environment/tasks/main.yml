# ===========================================
# REMOVE OLD USERS (Cleanup)
# ===========================================

- name: Remove deprecated users (test, demo, admin, sysadmin)
  user:
    name: "{{ item }}"
    state: absent
    remove: yes
  loop:
    - test
    - demo
    - admin
    - sysadmin
  ignore_errors: yes
  tags:
    - user_environment
    - cleanup
