---
# Base System Role - Default Variables
# ==============================================
# NOTE: Software versions are managed centrally in vulnerability-profiles.yml
# These defaults are only used as fallbacks if profiles don't specify a version
# ==============================================

# Default vulnerability profile (can be overridden via command line)
vulnerability_profile: "secure_profile"

# Base packages to install (not version-specific)
base_packages:
  - curl
  - wget
  - git
  - vim
  - htop
  - net-tools
  - unzip
  - software-properties-common
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release