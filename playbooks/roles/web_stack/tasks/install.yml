---
- name: Ensure destination directory exists
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Clean up any existing duplicate directories
  file:
    path: "{{ app_dir }}/{{ item }}"
    state: absent
  loop:
    - css
    - js
  when: labsys_wiki_enabled | default(true)

- name: Copy web application index file
  copy:
    src: "{{ role_path }}/index.php"
    dest: "{{ app_dir }}/index.php"
    owner: www-data
    group: www-data
    mode: preserve
  notify: Restart web service
  when: labsys_wiki_enabled | default(true)

- name: Copy includes directory with proper structure
  copy:
    src: "{{ role_path }}/includes/"
    dest: "{{ app_dir }}/includes/"
    owner: www-data
    group: www-data
    mode: preserve
    directory_mode: '0755'
  notify: Restart web service
  when: labsys_wiki_enabled | default(true)

- name: Template database configuration file
  template:
    src: "config.php"
    dest: "{{ app_dir }}/includes/config.php"
    owner: www-data
    group: www-data
    mode: '0644'
  notify: Restart web service
  when: labsys_wiki_enabled | default(true)

- name: Copy templates directory with proper structure
  copy:
    src: "{{ role_path }}/templates/"
    dest: "{{ app_dir }}/templates/"
    owner: www-data
    group: www-data
    mode: preserve
    directory_mode: '0755'
  notify: Restart web service
  when: labsys_wiki_enabled | default(true)

- name: Copy assets directory with proper structure
  copy:
    src: "{{ role_path }}/assets/"
    dest: "{{ app_dir }}/assets/"
    owner: www-data
    group: www-data
    mode: preserve
    directory_mode: '0755'
  notify: Restart web service
  when: labsys_wiki_enabled | default(true)

- name: Ensure proper file permissions for web files
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
    recurse: yes
  when: labsys_wiki_enabled | default(true)

- name: Remove default Apache index page
  file:
    path: /var/www/html/index.html
    state: absent
  when: labsys_wiki_enabled | default(true)

- name: Create landing page redirect to LabSys Wiki
  copy:
    content: |
      <!DOCTYPE html>
      <html>
      <head>
          <title>Lab Environment</title>
          <meta http-equiv="refresh" content="0;url=/labsys-wiki/">
      </head>
      <body>
          <h1>Lab Environment</h1>
          <p>Redirecting to <a href="/labsys-wiki/">LabSys Wiki</a>...</p>
      </body>
      </html>
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: '0644'
  when: labsys_wiki_enabled | default(true)

- name: Generate JWT secret
  set_fact:
    jwt_secret: "{{ lookup('password', '/dev/null length=64 chars=hexdigits') }}"
  run_once: true
  when: not (vulnerable_mode | default(false))

- name: Configure JWT secret in Apache environment
  lineinfile:
    path: /etc/apache2/envvars
    line: "export JWT_SECRET={{ jwt_secret }}"
    regexp: '^export JWT_SECRET='
    state: present
  notify: restart apache
  when: not (vulnerable_mode | default(false))

- name: Ensure Apache is running
  service:
    name: apache2
    state: started
    enabled: true
