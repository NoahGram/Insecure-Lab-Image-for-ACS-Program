---
# Web Stack Role - Apache, PHP installation and LabSys Wiki configuration

# First install Apache and PHP if not already done
- name: Stop and disable Nginx (if running) to free port 80
  systemd:
    name: nginx
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Remove Nginx package to avoid conflicts
  ansible.builtin.apt:
    name: nginx
    state: absent
  ignore_errors: yes

- name: Install Apache HTTP Server and PHP modules
  ansible.builtin.apt:
    name:
      - apache2
      - "{% if php_version == 'latest' %}php{% else %}php{{ php_version }}{% endif %}"
      - "{% if php_version == 'latest' %}php-mysql{% else %}php{{ php_version }}-mysql{% endif %}"
      - "{% if php_version == 'latest' %}php-curl{% else %}php{{ php_version }}-curl{% endif %}"
      - "{% if php_version == 'latest' %}php-gd{% else %}php{{ php_version }}-gd{% endif %}"
      - "{% if php_version == 'latest' %}php-mbstring{% else %}php{{ php_version }}-mbstring{% endif %}"
      - "{% if php_version == 'latest' %}php-xml{% else %}php{{ php_version }}-xml{% endif %}"
      - "{% if php_version == 'latest' %}php-zip{% else %}php{{ php_version }}-zip{% endif %}"
    state: present
    update_cache: yes

- name: Enable Apache modules
  apache2_module:
    name: "{{ item }}"
    state: present
  loop:
    - rewrite
    - ssl
    - headers
  notify: restart apache

- name: Start and enable Apache service
  systemd:
    name: apache2
    state: started
    enabled: yes

# Now install and configure LabSys Wiki components  
- name: Install LabSys Wiki application
  import_tasks: install.yml

- name: Configure and seed database for LabSys Wiki
  import_tasks: database.yml

- name: Create local system test users
  import_tasks: users.yml
