---
# Wait for MySQL to be available
- name: Wait for MySQL to be available
  wait_for:
    port: 3306
    host: localhost
    timeout: 60
  ignore_errors: yes

- name: Check if MariaDB is running
  service:
    name: mariadb
  register: mysql_service
  ignore_errors: yes

- name: Ensure wikidb database exists
  mysql_db:
    name: wikidb
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
  when: mysql_service is defined

- name: Create users table
  mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_db: wikidb
    query: |
      CREATE TABLE IF NOT EXISTS users (
        id INT AUTO_INCREMENT PRIMARY KEY,
        username VARCHAR(50),
        password VARCHAR(50),
        email VARCHAR(100)
      );
  when: mysql_service is defined

- name: Upgrade users table for login system
  mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_db: wikidb
    query: |
      ALTER TABLE users
      MODIFY COLUMN username VARCHAR(100) NOT NULL,
      MODIFY COLUMN password VARCHAR(255) NOT NULL,
      MODIFY COLUMN email VARCHAR(150),
      ADD COLUMN IF NOT EXISTS role VARCHAR(20) DEFAULT 'user',
      ADD COLUMN IF NOT EXISTS failed_attempts INT DEFAULT 0,
      ADD COLUMN IF NOT EXISTS last_failed TIMESTAMP NULL DEFAULT NULL,
      ADD UNIQUE KEY IF NOT EXISTS username_unique (username);
  when: mysql_service is defined

- name: Insert or update sample users with proper password hashing
  mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_db: wikidb
    query: "INSERT INTO users (id, username, password, email, role)
            VALUES ({{ item.id }}, '{{ item.username }}', '{{ (vulnerable_mode | default(false)) |
            ternary(item.password, item.password | password_hash('bcrypt')) }}', '{{ item.email }}', '{{ item.role }}')
            ON DUPLICATE KEY UPDATE 
            password = '{{ (vulnerable_mode | default(false)) | ternary(item.password, item.password | password_hash('bcrypt')) }}',
            email = '{{ item.email }}',
            role = '{{ item.role }}';"
  loop:
    - { id: 1, username: 'mcarter',   role: 'admin', password: 'R4ven!Oak92',      email: 'mcarter@techcorp.local' }
    - { id: 2, username: 'slopez',    role: 'user',  password: 'Sunset#3184',      email: 'slopez@techcorp.local' }
    - { id: 3, username: 'tnguyen',   role: 'user',  password: 'BlueSky@742',      email: 'tnguyen@techcorp.local' }
    - { id: 4, username: 'ajohnson',  role: 'user',  password: 'Forest!Wave66',   email: 'ajohnson@techcorp.local' }
    - { id: 5, username: 'dpatel',    role: 'user',  password: 'Crimson#Hill91',  email: 'dpatel@techcorp.local' }
    - { id: 6, username: 'kroberts',  role: 'admin', password: 'IronGate$558',    email: 'kroberts@techcorp.local' }
    - { id: 7, username: 'lwilson',   role: 'user',  password: 'RiverStone!204',  email: 'lwilson@techcorp.local' }
    - { id: 8, username: 'hkim',      role: 'user',  password: 'Nova*Cloud73',    email: 'hkim@techcorp.local' }

