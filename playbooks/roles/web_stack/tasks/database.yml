---
# Wait for MySQL to be available
- name: Wait for MySQL to be available
  wait_for:
    port: 3306
    host: localhost
    timeout: 60
  ignore_errors: yes

- name: Check if MariaDB is running
  service:
    name: mariadb
  register: mysql_service
  ignore_errors: yes

- name: Ensure testdb database exists
  mysql_db:
    name: testdb
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
  when: mysql_service is defined

- name: Create users table
  mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_db: testdb
    query: |
      CREATE TABLE IF NOT EXISTS users (
        id INT AUTO_INCREMENT PRIMARY KEY,
        username VARCHAR(50),
        password VARCHAR(50),
        email VARCHAR(100)
      );
  when: mysql_service is defined

- name: Upgrade users table for login system
  mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_db: testdb
    query: |
      ALTER TABLE users
      MODIFY COLUMN username VARCHAR(100) NOT NULL,
      MODIFY COLUMN password VARCHAR(255) NOT NULL,
      MODIFY COLUMN email VARCHAR(150),
      ADD COLUMN IF NOT EXISTS role VARCHAR(20) DEFAULT 'user',
      ADD COLUMN IF NOT EXISTS failed_attempts INT DEFAULT 0,
      ADD COLUMN IF NOT EXISTS last_failed TIMESTAMP NULL DEFAULT NULL,
      ADD UNIQUE KEY IF NOT EXISTS username_unique (username);
  when: mysql_service is defined

- name: Insert sample users
  mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_db: testdb
    query: "INSERT IGNORE INTO users (id, username, password, email, role)
            VALUES ({{ item.id }}, '{{ item.username }}', '{{ item.password }}', '{{ item.email }}', '{{ item.role }}');"
  loop:
    - { id: 1, username: 'admin', role: 'admin', password: 'Admin@Secure123!', email: 'admin@portal.local' }
    - { id: 2, username: 'jane',  role: 'user', password: 'Jane@Secure456!',  email: 'jane@portal.local' }
    - { id: 3, username: 'guest', role: 'user', password: 'Guest@Secure789!', email: 'guest@portal.local' }
  when: mysql_service is defined

- name: Create pages table
  mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_db: testdb
    query: |
      CREATE TABLE IF NOT EXISTS pages (
        id INT AUTO_INCREMENT PRIMARY KEY,
        title VARCHAR(100) UNIQUE,
        content TEXT,
        excerpt TEXT
      );
  when: mysql_service is defined

- name: Insert default Home page
  mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_db: testdb
    query: |
      INSERT IGNORE INTO pages (title, content, excerpt)
      VALUES ('Home', 'Welcome to LabSys Wiki! Use the "Edit" button to add content.', 'Welcome to LabSys Wiki!');
  when: mysql_service is defined

- name: Create activity_logs table for monitoring
  mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_db: testdb
    query: |
      CREATE TABLE IF NOT EXISTS activity_logs (
        id INT AUTO_INCREMENT PRIMARY KEY,
        timestamp DATETIME DEFAULT CURRENT_TIMESTAMP,
        username VARCHAR(100),
        ip_address VARCHAR(45),
        action VARCHAR(50),
        details TEXT,
        severity VARCHAR(20) DEFAULT 'info',
        user_agent TEXT,
        INDEX idx_timestamp (timestamp),
        INDEX idx_username (username),
        INDEX idx_action (action),
        INDEX idx_severity (severity)
      );
  when: mysql_service is defined
