---
# Create system users for LabSys Wiki testing
# Note: Main user creation is handled by user_environment role
# This only ensures users exist for web app testing

- name: Ensure test system users exist
  user:
    name: "{{ item.name }}"
    shell: /bin/bash
    create_home: yes
    state: present
  loop:
    - { name: "guest", password: "guest" }  
    - { name: "backup", password: "Backup2024!" }

# Set passwords using chpasswd (works without passlib)
- name: Set passwords for test users
  shell: |
    echo "{{ item.name }}:{{ item.password }}" | chpasswd
  loop:
    - { name: "guest", password: "guest" }
    - { name: "backup", password: "Backup2024!" }
  no_log: true  # Don't log passwords
