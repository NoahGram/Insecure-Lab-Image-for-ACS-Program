              font-size:0.88rem;
              text-decoration:none;
              transition:background 0.2s ease, transform 0.1s ease;
            }
            .btn:hover { background:var(--accent-600); transform:translateY(-1px); }
            .btn:active { transform:translateY(0); }

            .btn-delete {
              background:#d33;
            }
            .btn-delete:hover {
              background:#b22;
            }
            .textarea#content {
                resize: vertical;
            }
            .meta{font-size:0.85rem;color:var(--muted);margin-bottom:10px}
            pre.results{background:#0b1220;color:#e6eef6;padding:12px;border-radius:8px;white-space:pre-wrap}
            .page-title{font-family:'Merriweather',serif;font-size:1.4rem;margin:0 0 6px 0}
            .content{line-height:1.6}
            .editor{margin-top:12px}
            .small{font-size:0.85rem;color:var(--muted)}
            .login-box{border:1px solid #e6e9ee;padding:12px;border-radius:8px}
            footer{grid-column:1 / span 2;text-align:center;color:var(--muted);margin-top:14px}
            @media (max-width:920px){ .wrap{grid-template-columns:1fr} aside.card{order:2} }
            </style>
          </head>
          <body>
          <div class="wrap" role="application" aria-label="LabSys Wiki">
            <header>
              <div class="brand">
                <div class="logo">LW</div>
                <div>
                  <h1>LabSys Wiki — Internal Knowledgebase</h1>
                  <div class="lead">Documentation • How-tos • Diagnostics — Training Lab</div>
                </div>
              </div>

              <div style="display:flex;gap:8px;align-items:center">
                <?php if(!empty($_SESSION['username'])): ?>
                  <div class="small muted">Ingelogd als <strong><?php echo h($_SESSION['username']); ?></strong> (<?php echo h($_SESSION['role'] ?? 'user'); ?>)</div>
                  <a class="btn" href="?action=logout">Log uit</a>
                <?php else: ?>
                  <a class="btn" href="?action=showlogin">Log in</a>
                <?php endif; ?>
              </div>
            </header>

            <main class="card" role="main">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <div>
                  <form method="GET" style="display:flex;gap:8px;align-items:center">
                    <input type="hidden" name="action" value="search">
                    <input name="q" type="text" placeholder="Zoek pagina's..." value="<?php echo isset($_GET['q'])?h($_GET['q']):''; ?>">

                    <!-- New: search scope control -->
                    <label for="scope" class="small muted" style="margin:0 6px 0 0;">Zoek in:</label>
                    <select id="scope" name="scope" aria-label="Zoek in">
                      <option value="both" <?php echo (isset($_GET['scope']) && $_GET['scope']==='title') ? '' : 'selected'; ?>>Titel + inhoud</option>
                      <option value="title" <?php echo (isset($_GET['scope']) && $_GET['scope']==='title') ? 'selected' : ''; ?>>Alleen titel</option>
                    </select>

                    <button class="btn" type="submit">Zoek</button>
                  </form>
                </div>
                <div style="display:flex;gap:6px;">
                  <?php if(($_SESSION['role'] ?? '') === 'admin'): ?>
                    <a class="btn" href="?action=edit&page=<?php echo rawurlencode($page); ?>">Bewerk pagina</a>
                    <a class="btn" href="?action=create">Maak nieuwe pagina</a>
                  <?php else: ?>
                    <!-- non-admins do not get create/edit buttons -->
                  <?php endif; ?>
                </div>
              </div>
              <hr>

              <?php
              $conn = db_connect();

              if($action === 'showlogin'){
                  ?>
                  <h2 class="page-title">Login</h2>
                  <div class="login-box">
                    <?php if(!empty($login_error)) echo '<div class="muted" style="color:#a33;margin-bottom:8px">'.h($login_error).'</div>'; ?>
                    <form method="POST" action="?action=login">
                      <label for="username">Gebruikersnaam</label>
                      <input id="username" name="username" type="text" required>
                      <label for="password" style="margin-top:8px">Wachtwoord</label>
                      <input id="password" name="password" type="password" required>
                      <div style="margin-top:8px">
                        <button class="btn" type="submit">Log in</button>
                        <a href="?page=Home" class="small" style="margin-left:8px">Annuleer</a>
                      </div>
                    </form>
                  </div>
                  <?php
              }
              elseif($action === 'view'){
                  echo '<h2 class="page-title">'.h($page).'</h2>';
                  if($conn){
                      if($r = $conn->prepare("SELECT content FROM pages WHERE title = ? LIMIT 1")){
                          $r->bind_param('s', $page);
                          $r->execute();
                          $res = $r->get_result();
                          if($row = $res->fetch_assoc()) echo '<div class="content">'. $row['content'] .'</div>';
                          else echo '<div class="content muted">Pagina niet gevonden. Klik "Maak nieuwe pagina" als je admin bent.</div>';
                          $r->close();
                      }
                      $conn->close();
                  }
              }
              elseif($action === 'edit' || $action === 'create'){
                  // only admin allowed
                  if(($_SESSION['role'] ?? '') !== 'admin'){
                      http_response_code(403);
                      echo '<h2 class="page-title">Toegang geweigerd</h2><div class="content muted">Alleen admins mogen pagina\'s bewerken of maken.</div>';
                  } else {
                      $content = '';
                      $edit_page = ($action === 'edit') ? $page : '';
                      if($action === 'create' && isset($_POST['new_page'])) $edit_page = $_POST['new_page'];
                      if($conn && $edit_page){
                          if($r = $conn->prepare("SELECT content FROM pages WHERE title = ? LIMIT 1")){
                              $r->bind_param('s', $edit_page);
                              $r->execute();
                              $res = $r->get_result();
                              if($row = $res->fetch_assoc()) $content = $row['content'];
                              $r->close();
                          }
                          $conn->close();
                      }
                      ?>
                      <h2 class="page-title"><?php echo ($content ? 'Bewerk' : 'Maak') . ' pagina: ' . h($edit_page ?? ''); ?></h2>
                      <?php if($action === 'create' && !$edit_page){ ?>
                          <form method="POST" class="editor" action="?action=create">
                            <label for="new_page">Titel nieuwe pagina</label>
                            <input id="new_page" name="new_page" type="text" required>
                            <div style="margin-top:8px">
                              <button class="btn" type="submit">Ga verder</button>
                            </div>
                          </form>
                      <?php } else { ?>
                          <form method="POST" class="editor" action="?action=save">
                            <input type="hidden" name="page" value="<?php echo h($edit_page); ?>">
                            <label for="content">Pagina inhoud (Markdown-achtig)</label>
                            <textarea id="content" name="content" rows="12"><?php echo h($content); ?></textarea>
                            <div style="margin-top:8px">
                              <button class="btn" type="submit"><?php echo $content ? 'Opslaan' : 'Creëer'; ?></button>
                              <a href="?page=Home" style="margin-left:8px" class="small">Annuleer</a>

                              <div style="margin-top:10px">
                                <a href="?action=delete&page=<?php echo rawurlencode($edit_page); ?>"
                                  class="btn btn-delete"
                                  onclick="return confirm('Weet je zeker dat je deze pagina wilt verwijderen?');">Verwijder pagina</a>
                              </div>

                            </div>
                          </form>
                      <?php }
                  }
              }
              elseif($action === 'search' && !empty($_GET['q'])){
                $q = trim($_GET['q']);
                $scope = $_GET['scope'] ?? 'both'; // 'both' or 'title'

                echo '<h2 class="page-title">Zoekresultaten</h2>';

                if($conn){
                    if($scope === 'title'){
                        // search only in title
                        $sql = "SELECT title, excerpt FROM pages WHERE title LIKE CONCAT('%', ?, '%') LIMIT 50";
                        if($s = $conn->prepare($sql)){
                            $s->bind_param('s', $q);
                            $s->execute();
                            $res = $s->get_result();

                            echo '<pre class="results" aria-live="polite">';
                            if($res->num_rows === 0) {
                                echo "Geen resultaten gevonden voor '".h($q)."' in titels.\n";
                            } else {
                                while($row = $res->fetch_assoc()){
                                    echo "Page: <a href='?page=".rawurlencode($row['title'])."'>".h($row['title'])."</a> — ".h($row['excerpt'])."\n";
                                }
                            }
                            echo '</pre>';
                            $s->close();
                        } else {
                            echo '<div class="muted">Databasefout bij zoeken.</div>';
                        }
                    } else {
                        // default: search title OR content (legacy behavior)
                        $sql = "SELECT title, excerpt FROM pages WHERE title LIKE CONCAT('%', ?, '%') OR content LIKE CONCAT('%', ?, '%') LIMIT 50";
                        if($s = $conn->prepare($sql)){
                            $s->bind_param('ss', $q, $q);
                            $s->execute();
                            $res = $s->get_result();

                            echo '<pre class="results" aria-live="polite">';
                            if($res->num_rows === 0) {
                                echo "Geen resultaten gevonden voor '".h($q)."' in titels of inhoud.\n";
                            } else {
                                while($row = $res->fetch_assoc()){
                                    echo "Page: <a href='?page=".rawurlencode($row['title'])."'>".h($row['title'])."</a> — ".h($row['excerpt'])."\n";
                                }
                            }
                            echo '</pre>';
                            $s->close();
                        } else {
                            echo '<div class="muted">Databasefout bij zoeken.</div>';
                        }
                    }
                    $conn->close();
                }
            }
              ?>
            </main>

            <aside class="card">
              <section class="toc">
                <h4>Inhoud</h4>
                <ul class="small muted">
                  <li><a href="?page=Home">Home</a></li>
                  <li><a href="?page=Getting-Started">Getting Started</a></li>
                  <li><a href="?page=Network-Diagnostics">Network Diagnostics</a></li>
                  <li><a href="?page=Security-Notes">Security Notes</a></li>
                  <li><a href="?action=search&q=FAQ">Zoek: FAQ</a></li>
                </ul>
              </section>
            </aside>

            <footer>
              <small>LabSys Wiki — training lab. Keep it isolated and responsible.</small>
            </footer>
          </div>
          </body>
          </html>






    # ===========================================
    # DATABASE SETUP
    # ===========================================
    - name: Create users table
      mysql_query:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_db: testdb
        query: |
          CREATE TABLE IF NOT EXISTS users (
            id INT AUTO_INCREMENT PRIMARY KEY,
            username VARCHAR(50),
            password VARCHAR(50),
            email VARCHAR(100)
          );

    - name: Insert sample users
      mysql_query:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_db: testdb
        query: "INSERT IGNORE INTO users (id, username, password, email) VALUES ({{ item.id }}, '{{ item.username }}', '{{ item.password }}', '{{ item.email }}');"
      loop:
        - { id: 1, username: 'admin', password: 'admin123', email: 'admin@portal.local' }
        - { id: 2, username: 'jane',  password: 'password',  email: 'jane@portal.local' }
        - { id: 3, username: 'guest', password: 'guest',     email: 'guest@portal.local' }

    - name: Create pages table
      mysql_query:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_db: testdb
        query: |
          CREATE TABLE IF NOT EXISTS pages (
            id INT AUTO_INCREMENT PRIMARY KEY,
            title VARCHAR(100) UNIQUE,
            content TEXT,
            excerpt TEXT
          );
    - name: Insert default Home page
      mysql_query:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_db: testdb
        query: |
          INSERT IGNORE INTO pages (title, content, excerpt) 
          VALUES ('Home', 'Welkom bij LabSys Wiki! Gebruik de "Bewerken"-knop om inhoud toe te voegen.', 'Welkom bij LabSys Wiki!');


    # ===========================================
    # CREATE TEST USERS (SYSTEM USERS)
    # ===========================================
    - name: Create test users
      user:
        name: "{{ item.name }}"
        password: "{{ item.password | password_hash('sha512') }}"
        shell: /bin/bash
      loop:
        - { name: "sysadmin", password: "admin" }
        - { name: "guest", password: "guest" }
        - { name: "backup", password: "backup123" }

    # ===========================================
    # APACHE INFO DISCLOSURE
    # ===========================================
    - name: Enable Apache Info Disclosure
      copy:
        content: |
          <Location "/server-info">
              SetHandler server-info
              Require all granted
          </Location>

          <Location "/server-status">
              SetHandler server-status
              Require all granted
          </Location>
        dest: /etc/apache2/conf-available/info.conf

    - name: Enable vulnerable Apache settings
      lineinfile:
        path: /etc/apache2/apache2.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: "^ServerTokens", line: "ServerTokens Full" }
        - { regexp: "^ServerSignature", line: "ServerSignature On" }

    - name: Enable info config and restart Apache
      command: a2enconf info
      notify: restart apache

    # ===========================================
    # HANDLERS
    # ===========================================
  handlers:
    - name: restart apache
      systemd:
        name: apache2
        state: restarted
