---
- name: 02 - Deploy LabSys Wiki Portal (Vulnerable Training Environment)
  hosts: vps_lab
  gather_facts: yes
  vars:
    mysql_root_password: "CleanLabPassword123!"

  tasks:

    # ===========================================
    # INSTALL DEPENDENCIES
    # ===========================================
    - name: Ensure Apache, PHP, and MySQL are installed
      apt:
        name:
          - apache2
          - php
          - php-mysqli
          - mariadb-server
        state: present
        update_cache: yes

  # ===========================================
  # DEPLOY WIKI PORTAL (Training Lab)
  # ===========================================
    - name: Deploy LabSys Wiki Portal (with login & admin-only edit/create)
      copy:
        dest: /var/www/html/index.php
        owner: www-data
        group: www-data
        mode: '0644'
        content: |
          <?php
          // (your full PHP+HTML code from the previous message goes here)
          ?>

  # ===========================================
  # DATABASE SETUP / UPGRADE FOR LOGIN SYSTEM
  # ===========================================
    - name: Upgrade users table for login system
      mysql_query:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_db: testdb
        query: |
          ALTER TABLE users
          MODIFY COLUMN username VARCHAR(100) NOT NULL,
          MODIFY COLUMN password VARCHAR(255) NOT NULL,
          MODIFY COLUMN email VARCHAR(150),
          ADD COLUMN IF NOT EXISTS role VARCHAR(20) DEFAULT 'user',
          ADD UNIQUE KEY IF NOT EXISTS username_unique (username);

    - name: Insert or update sample users with roles
      mysql_query:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_db: testdb
        query: |
          INSERT INTO users (id, username, password, email, role)
          VALUES
            (1, 'admin', 'admin123', 'admin@portal.local', 'admin'),
            (2, 'jane', 'password', 'jane@portal.local', 'user'),
            (3, 'guest', 'guest', 'guest@portal.local', 'user')
          ON DUPLICATE KEY UPDATE
            password=VALUES(password),
            email=VALUES(email),
            role=VALUES(role);


    # INDEX.PHP
    - name: Deploy LabSys Wiki Portal (with login & admin-only edit/create)
      copy:
        dest: /var/www/html/index.php
        owner: www-data
        group: www-data
        mode: '0644'
        content: |
          <?php
          session_start();

          // DB config
          $DB_HOST='localhost';
          $DB_USER='root';
          $DB_PASS='CleanLabPassword123!';
          $DB_NAME='testdb';

          function db_connect(){
              global $DB_HOST,$DB_USER,$DB_PASS,$DB_NAME;
              $conn = new mysqli($DB_HOST,$DB_USER,$DB_PASS,$DB_NAME);
              if($conn->connect_error) return null;
              $conn->set_charset('utf8mb4');
              return $conn;
          }

          // helper: safe output
          function h($s){ return htmlspecialchars($s, ENT_QUOTES|ENT_SUBSTITUTE, 'UTF-8'); }

          // Determine action/page
          $action = $_REQUEST['action'] ?? 'view';
          $page = $_REQUEST['page'] ?? 'Home';

          // LOGIN: handle POST login
          if($action === 'login' && $_SERVER['REQUEST_METHOD'] === 'POST'){
              $username = $_POST['username'] ?? '';
              $password = $_POST['password'] ?? '';
              $conn = db_connect();
              if($conn){
                  if($stmt = $conn->prepare('SELECT id, username, password, role FROM users WHERE username = ? LIMIT 1')){
                      $stmt->bind_param('s', $username);
                      $stmt->execute();
                      $res = $stmt->get_result();
                      if($row = $res->fetch_assoc()){
                          $stored = $row['password'];
                          $ok = false;
                          // If stored value is a password_hash, use password_verify.
                          if (strlen($stored) >= 60 && (strpos($stored, '$2y$') === 0 || strpos($stored, '$argon2') === 0 || strpos($stored, '$2a$') === 0)) {
                              if(password_verify($password, $stored)) $ok = true;
                          } else {
                              // Legacy fallback: direct comparison (training lab compatibility)
                              if(hash_equals((string)$stored, (string)$password)) $ok = true;
                          }

                          if($ok){
                              // login success
                              session_regenerate_id(true);
                              $_SESSION['username'] = $row['username'];
                              $_SESSION['role'] = $row['role'] ?? 'user';
                              header('Location: ?page='.rawurlencode($page));
                              exit;
                          } else {
                              $login_error = 'Ongeldige gebruikersnaam of wachtwoord.';
                          }
                      } else {
                          $login_error = 'Ongeldige gebruikersnaam of wachtwoord.';
                      }
                      $stmt->close();
                  }
                  $conn->close();
              } else {
                  $login_error = 'Databasefout — geen verbinding.';
              }
          }

          // LOGOUT
          if($action === 'logout'){
              $_SESSION = [];
              if (ini_get("session.use_cookies")) {
                  $params = session_get_cookie_params();
                  setcookie(session_name(), '', time() - 42000,
                      $params["path"], $params["domain"],
                      $params["secure"], $params["httponly"]
                  );
              }
              session_destroy();
              header('Location: ?page=Home');
              exit;
          }

          // SAVE / CREATE PAGE - only allow if logged-in admin
          if($action === 'save' && $_SERVER['REQUEST_METHOD'] === 'POST'){
              $save_page = $_POST['page'] ?? 'Home';
              $save_content = $_POST['content'] ?? '';

              // permission check
              $user_role = $_SESSION['role'] ?? null;
              if($user_role !== 'admin'){
                  http_response_code(403);
                  die('Verboden: alleen admins mogen pagina\'s aanmaken of bewerken.');
              }

              $conn = db_connect();
              if($conn){
                  // use prepared statements to avoid SQL injection
                  // check existence
                  if($stmt = $conn->prepare('SELECT id FROM pages WHERE title = ? LIMIT 1')){
                      $stmt->bind_param('s', $save_page);
                      $stmt->execute();
                      $res = $stmt->get_result();
                      if($row = $res->fetch_assoc()){
                          // update
                          if($upd = $conn->prepare('UPDATE pages SET content = ?, excerpt = ? WHERE id = ?')){
                              $excerpt = mb_substr($save_content, 0, 140);
                              $upd->bind_param('ssi', $save_content, $excerpt, $row['id']);
                              $upd->execute();
                              $upd->close();
                          }
                      } else {
                          // insert
                          if($ins = $conn->prepare('INSERT INTO pages (title, content, excerpt) VALUES (?, ?, ?)')){
                              $excerpt = mb_substr($save_content, 0, 140);
                              $ins->bind_param('sss', $save_page, $save_content, $excerpt);
                              $ins->execute();
                              $ins->close();
                          }
                      }
                      $stmt->close();
                  }
                  $conn->close();
                  header('Location: ?page='.rawurlencode($save_page));
                  exit;
              } else {
                  die('Databasefout bij opslaan.');
              }
          }

          // DELETE PAGE (admin only)
          if($action === 'delete'){
              $del_page = $_GET['page'] ?? '';
              $user_role = $_SESSION['role'] ?? null;

              if($user_role !== 'admin'){
                  http_response_code(403);
                  die('Verboden: alleen admins mogen pagina\'s verwijderen.');
              }

              if($del_page === 'Home'){
                  echo "<script>
                          alert('De startpagina kan niet worden verwijderd.');
                          window.location.href='?page=Home';
                        </script>";
                  exit;
              }

              $conn = db_connect();
              if($conn){
                  if($stmt = $conn->prepare('DELETE FROM pages WHERE title = ? LIMIT 1')){
                      $stmt->bind_param('s', $del_page);
                      $stmt->execute();
                      $stmt->close();
                  }
                  $conn->close();
              }

              header('Location: ?page=Home');
              exit;
          }


          // Render site (HTML)
          ?>
          <!doctype html>
          <html lang="nl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>LabSys Wiki — Internal Knowledgebase</title>
            <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,700;1,300&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
            <style>
            :root{
              --bg:#f7f8fb;
              --panel:#fff;
              --muted:#6b7280;
              --text:#111827;
              --accent:#1f6feb;
              --accent-600:#184ea8;
