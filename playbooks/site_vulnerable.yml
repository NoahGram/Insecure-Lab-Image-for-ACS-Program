---
- name: Deploy Complete Vulnerable Lab Environment (Role-Based)
  hosts: vps_lab
  gather_facts: yes
  vars:
    # Default profile name if not provided via command line
    profile_name: "{{ vulnerability_profile | default('vulnerable_profile') }}"
    
  vars_files:
    - ../vulnerability-profiles.yml
  
  # Set version variables based on selected profile
  pre_tasks:
    - name: Load profile-specific versions
      set_fact:
        apache_version: "{{ vars[profile_name]['versions']['apache_version'] | default('latest') }}"
        php_version: "{{ vars[profile_name]['versions']['php_version'] | default('latest') }}"
        mysql_version: "{{ vars[profile_name]['versions']['mysql_version'] | default('latest') }}"
        gitea_version: "{{ vars[profile_name]['versions']['gitea_version'] | default('1.15.0') }}"
        dokuwiki_version: "{{ vars[profile_name]['versions']['dokuwiki_version'] | default('stable') }}"
        mantisbt_version: "{{ vars[profile_name]['versions']['mantisbt_version'] | default('2.25.8') }}"
        cockpit_version: "{{ vars[profile_name]['versions']['cockpit_version'] | default('latest') }}"
        postfix_version: "{{ vars[profile_name]['versions']['postfix_version'] | default('latest') }}"
        # Load vulnerability controls
        vulnerability_config: "{{ vars[profile_name]['vulnerabilities'] | default({}) }}"
        vulnerable_mode: true
        
    - name: Display selected vulnerability profile
      debug:
        msg:
          - "Selected vulnerability profile: {{ profile_name }}"
          - "Vulnerable mode: {{ vulnerable_mode }}"
          - "Apache version: {{ apache_version }}"
          - "PHP version: {{ php_version }}"

  roles:
    - base_system
    - web_stack  
    - database
    - applications
    - system_services
    - vulnerabilities  # Add vulnerabilities role
    
  post_tasks:
    # Create vulnerable database entries
    - name: Create vulnerable database with weak credentials
      mysql_db:
        name: testdb
        state: present
        login_user: root
        login_password: "{{ mysql_root_password }}"

    - name: Create database user with weak password
      mysql_user:
        name: testuser
        password: "testpass"
        priv: "testdb.*:ALL"
        host: "%"
        state: present
        login_user: root
        login_password: "{{ mysql_root_password }}"

    - name: Create vulnerable database table
      mysql_query:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_db: testdb
        query: |
          CREATE TABLE IF NOT EXISTS users (
            id INT AUTO_INCREMENT PRIMARY KEY,
            username VARCHAR(50),
            password VARCHAR(50),
            email VARCHAR(100),
            role VARCHAR(20)
          );
          
    - name: Insert sample vulnerable data
      mysql_query:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_db: testdb
        query: |
          INSERT IGNORE INTO users (id, username, password, email, role) VALUES
          (1, 'admin', 'admin123', 'admin@lab.local', 'admin'),
          (2, 'john', 'password', 'john@lab.local', 'user'),
          (3, 'guest', 'guest', 'guest@lab.local', 'guest'),
          (4, 'test', 'test123', 'test@lab.local', 'user');
          
    - name: Create comprehensive vulnerability guide
      copy:
        content: |
          ==============================================
          VULNERABILITY ASSESSMENT LAB GUIDE
          ==============================================
          Profile: {{ profile_name }}
          
          This system contains intentional vulnerabilities for educational testing.
          ⚠️  WARNING: NEVER expose this system to the internet!
          
          Web Vulnerabilities:
          - SQL Injection: /vulnerable.php?id=1' OR '1'='1
          - XSS: /vulnerable.php?name=<script>alert('XSS')</script>  
          - File Upload: /upload.php (accepts any file type)
          - Info Disclosure: /server-info, /server-status
          
          System Access:
          - Weak accounts: admin/admin, test/test, guest/guest
          - Database: testuser/testpass (% access)
          
          Testing Tools:
          - nmap -sV {{ ansible_default_ipv4.address }}
          - sqlmap -u "http://{{ ansible_default_ipv4.address }}/vulnerable.php?id=1"
          - nikto -h {{ ansible_default_ipv4.address }}
          
          ==============================================
        dest: /root/vulnerability-guide.txt
        mode: '0644'
        
    - name: Display deployment summary
      debug:
        msg:
          - "=== VULNERABLE LAB DEPLOYMENT COMPLETE ==="
          - "Profile: {{ profile_name }}"  
          - "Vulnerable endpoints available at http://localhost:8080"
          - "See /root/vulnerability-guide.txt for testing instructions"
          - "⚠️  WARNING: Contains intentional vulnerabilities!"