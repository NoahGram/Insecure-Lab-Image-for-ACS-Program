---
- name: Deploy Complete Vulnerable Lab Environment (Role-Based)
  hosts: vps_lab
  gather_facts: yes
  vars:
    # Default vulnerability profile - can be overridden via extra-vars
    default_vulnerability_profile: "vulnerable_profile"
    
  vars_files:
    - ../vulnerability-profiles.yml
  
  # Set version variables based on selected profile
  pre_tasks:
    - name: Set current vulnerability profile
      set_fact:
        current_profile: "{{ vulnerability_profile | default(default_vulnerability_profile) }}"

    - name: Load profile-specific versions
      set_fact:
        apache_version: "{{ vars[current_profile]['versions']['apache_version'] | default('latest') }}"
        php_version: "{{ vars[current_profile]['versions']['php_version'] | default('latest') }}"
        mysql_version: "{{ vars[current_profile]['versions']['mysql_version'] | default('latest') }}"
        gitea_version: "{{ vars[current_profile]['versions']['gitea_version'] | default('1.15.0') }}"
        dokuwiki_version: "{{ vars[current_profile]['versions']['dokuwiki_version'] | default('stable') }}"
        mantisbt_version: "{{ vars[current_profile]['versions']['mantisbt_version'] | default('2.25.8') }}"
        cockpit_version: "{{ vars[current_profile]['versions']['cockpit_version'] | default('latest') }}"
        postfix_version: "{{ vars[current_profile]['versions']['postfix_version'] | default('latest') }}"
        # Load vulnerability controls
        vulnerability_config: "{{ vars[current_profile]['vulnerabilities'] | default({}) }}"
        vulnerable_mode: true
        
    - name: Display selected vulnerability profile
      debug:
        msg:
          - "Selected vulnerability profile: {{ current_profile }}"
          - "Vulnerable mode: {{ vulnerable_mode }}"
          - "Apache version: {{ apache_version }}"
          - "PHP version: {{ php_version }}"

  roles:
    - base_system
    - database
    - web_stack
    - phpmyadmin
    - applications
    - system_services
    - user_environment
    - vulnerabilities
    
  post_tasks:
          
    - name: Display deployment summary
      debug:
        msg:
          - "=== VULNERABLE LAB DEPLOYMENT COMPLETE ==="
          - "Profile: {{ current_profile }}"  
          - "Apache available at http://localhost:8080"
          - "Labsys-Wiki available at http://localhost:8080/labsys-wiki"
          - "MantisBT available at http://localhost:8080/mantisbt"
          - "Gitea available at http://localhost:3000"
          - "Cockpit available at http://localhost:9090/"
          - "Roundcube available at http://localhost:8080/roundcube"