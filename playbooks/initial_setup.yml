---
- name: Initial Setup and System Update
  hosts: vps
  gather_facts: yes
  
  tasks:
    - name: Ensure Python is installed (required for Ansible)
      # Ansible's raw module is used as a bootstrap step for hosts where Python isn't guaranteed
      ansible.builtin.raw: |
        if ! command -v python3 &> /dev/null; then
          apt update && apt install -y python3
        fi
      register: python_install_status
      changed_when: python_install_status.rc != 0
      
    - name: Gather facts (now with Python available)
      ansible.builtin.setup:
      
    - name: Perform a full system upgrade
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
      when: ansible_os_family == "Debian"
      tags: always
      
    - name: Install common packages (e.g., git, vim, curl)
      ansible.builtin.package:
        name:
          - git
          - vim
          - curl
          - net-tools
        state: present
        
    - name: Ping the host for connectivity test
      ansible.builtin.ping:
      tags: always